
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClubComm - Taken</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <a href="ouderportaal.html" class="back-link">
        <i class="fas fa-home"></i>
        Home
      </a>
      <div style="flex: 1; text-align: center;">
        <h1 class="header-title">
          <i class="fas fa-tasks"></i> Vrijwilligerstaken
        </h1>
      </div>
      <button onclick="logout()" class="logout-btn" title="Uitloggen">
        <i class="fas fa-sign-out-alt"></i>
      </button>
    </div>
  </header>

  <div class="container">
    <!-- Mijn Taken -->
    <div class="section">
      <h3 style="color: #1e5ba8; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-clipboard-check"></i> Mijn Taken
      </h3>
      <div id="myTasks"></div>
    </div>

    <!-- Beschikbare Taken -->
    <div class="section">
      <h3 style="color: #1e5ba8; font-size: 1.2rem; font-weight: 700; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fas fa-hand-paper"></i> Beschikbare Taken
      </h3>
      <div id="availableTasks"></div>
    </div>
  </div>

  <!-- Task Info Modal -->
  <div id="taskInfoModal" class="task-modal">
    <div class="task-modal-content">
      <div class="task-modal-header">
        <h3 id="modalTitle"></h3>
        <button onclick="closeTaskModal()" class="modal-close-btn">
          <i class="fas fa-times"></i>
        </button>
      </div>
      <div id="modalDescription" class="task-modal-body"></div>
      <div class="task-modal-footer">
        <button onclick="closeTaskModal()" class="btn btn-primary">
          <i class="fas fa-check"></i> Begrepen
        </button>
      </div>
    </div>
  </div>

  <!-- Consistente Navigatie -->
  <nav class="menubalk" role="navigation" aria-label="Hoofdnavigatie">
    <button type="button" class="nav-item" onclick="navigateToPage('ouderportaal.html')">
      <i class="fas fa-home"></i>
      <span>Dashboard</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('overzicht.html')">
      <i class="fas fa-calendar-alt"></i>
      <span>Planning</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('vervoer.html')">
      <i class="fas fa-car"></i>
      <span>Vervoer</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('prikbord.html')">
      <i class="fas fa-comments"></i>
      <span>Berichten</span>
    </button>
    <button type="button" class="nav-item active" onclick="navigateToPage('taken.html')">
      <i class="fas fa-tasks"></i>
      <span>Taken</span>
    </button>
  </nav>

  <script src="script.js"></script>
  <script>
    const volunteerTasks = [
      {
        id: 1,
        title: "Spelbegeleider",
        description: "Ondersteun de scheidsrechter tijdens de wedstrijd. Communiceer met ouders en spelers. Help bij discussies en zorg voor een positieve sfeer. Blijf kalm en respectvol.",
        date: "Zaterdag 7 december",
        time: "13:45-15:15",
        volunteer: null,
        type: "wedstrijd",
        icon: "fas fa-whistle",
        color: "#ef4444"
      },
      {
        id: 2,
        title: "Teamleider",
        description: "Houd wissels bij tijdens de wedstrijd. Controleer speeltijd van alle spelers. Noteer tijdstippen en zorg dat iedereen evenredig speelt. Communiceer met trainer over wisselmomenten.",
        date: "Zaterdag 7 december",
        time: "13:45-15:15",
        volunteer: null,
        type: "wedstrijd",
        icon: "fas fa-users",
        color: "#3b82f6"
      },
      {
        id: 3,
        title: "Materialen & Verzorging",
        description: "Zorg voor teamkleding en materialen. Regel limonade voor rust en na afloop. Controleer of alle spullen compleet zijn. Houd het materiaal netjes en georganiseerd.",
        date: "Zaterdag 7 december",
        time: "13:30-16:00",
        volunteer: "Sandra de Wit",
        type: "wedstrijd",
        icon: "fas fa-tshirt",
        color: "#10b981"
      },
      {
        id: 4,
        title: "Coach",
        description: "Begeleid de wedstrijd vanaf de zijlijn. Coach spelers positief en motiverend. Geef tactische aanwijzingen en bemoedig het team. Blijf altijd respectvol naar alle partijen.",
        date: "Zaterdag 7 december",
        time: "13:45-15:15",
        volunteer: null,
        type: "wedstrijd",
        icon: "fas fa-chalkboard-teacher",
        color: "#8b5cf6"
      },
      {
        id: 5,
        title: "Wastas",
        description: "Was en verzorg de teamkleding na training/wedstrijd. Zorg dat alles schoon en klaar is voor volgende keer. Controleer op beschadigingen en rapporteer indien nodig.",
        date: "Woensdag 11 december",
        time: "Na training",
        volunteer: null,
        type: "training",
        icon: "fas fa-tshirt",
        color: "#f59e0b"
      },
      {
        id: 6,
        title: "Fotograaf",
        description: "Maak mooie foto's tijdens de wedstrijd. Focus op actie en teamgeest. Deel foto's met ouders via de app. Respecteer privacy en vraag toestemming waar nodig.",
        date: "Zaterdag 7 december",
        time: "14:00-15:30",
        volunteer: null,
        type: "wedstrijd",
        icon: "fas fa-camera",
        color: "#06b6d4"
      },
      {
        id: 7,
        title: "Barmedewerker",
        description: "Bedien in de kantine tijdens wedstrijden. Verkoop drankjes en snacks. Houd de bar netjes en voorraad bij. Zorg voor vriendelijke service naar alle bezoekers.",
        date: "Zaterdag 7 december",
        time: "13:00-16:00",
        volunteer: null,
        type: "kantine",
        icon: "fas fa-coffee",
        color: "#f59e0b"
      }
    ];

    document.addEventListener('DOMContentLoaded', function() {
      loadTasks();
    });

    function loadTasks() {
      const tasks = JSON.parse(localStorage.getItem('volunteerTasks') || JSON.stringify(volunteerTasks));
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      const userEmail = currentUser.email || 'ouder@test.nl';

      const myTasks = tasks.filter(task => task.volunteer && (task.volunteer.includes('Test Ouder') || task.assignedTo === userEmail));
      const availableTasks = tasks.filter(task => !task.volunteer || task.volunteer === null);

      loadMyTasks(myTasks);
      loadAvailableTasksByDate(availableTasks);
    }

    function loadMyTasks(tasks) {
      const container = document.getElementById('myTasks');

      if (tasks.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 1.5rem; color: var(--text-gray); background: var(--soft-gray); border-radius: 12px;">
            <i class="fas fa-clipboard" style="font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5;"></i>
            <h4 style="margin: 0 0 0.5rem 0;">Geen taken toegewezen</h4>
            <p style="margin: 0; font-size: 0.9rem;">Bekijk hieronder de beschikbare taken.</p>
          </div>
        `;
        return;
      }

      container.innerHTML = tasks.map(task => createMyTaskHTML(task)).join('');
    }

    function loadAvailableTasksByDate(tasks) {
      const container = document.getElementById('availableTasks');

      if (tasks.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 1.5rem; color: var(--text-gray); background: var(--soft-gray); border-radius: 12px;">
            <i class="fas fa-check-circle" style="font-size: 2rem; margin-bottom: 0.5rem; opacity: 0.5; color: var(--success);"></i>
            <h4 style="margin: 0 0 0.5rem 0;">Alle taken zijn toegewezen</h4>
            <p style="margin: 0; font-size: 0.9rem;">Geweldig! Alle vrijwilligerstaken hebben iemand gevonden.</p>
          </div>
        `;
        return;
      }

      const tasksByDate = {};
      tasks.forEach(task => {
        if (!tasksByDate[task.date]) {
          tasksByDate[task.date] = [];
        }
        tasksByDate[task.date].push(task);
      });

      container.innerHTML = Object.entries(tasksByDate).map(([date, dateTasks]) => 
        createDateGroupHTML(date, dateTasks)
      ).join('');
    }

    function createDateGroupHTML(date, tasks) {
      const dateId = date.replace(/\s+/g, '_').replace(/[^\w]/g, '_');
      const taskCount = tasks.length;
      
      return `
        <div class="date-group-card">
          <div class="date-header" onclick="toggleDateTasks('${dateId}')">
            <div class="date-info">
              <div class="date-title">
                <i class="fas fa-calendar-alt"></i>
                <span>${date}</span>
              </div>
            </div>
            <div class="date-controls">
              <div class="task-count">
                <i class="fas fa-bell"></i>
                <span>${taskCount}</span>
              </div>
              <i class="fas fa-chevron-down toggle-arrow" id="arrow-${dateId}"></i>
            </div>
          </div>
          
          <div id="tasks-${dateId}" class="tasks-container collapsed">
            ${tasks.map(task => createCompactTaskHTML(task)).join('')}
          </div>
        </div>
      `;
    }

    function createCompactTaskHTML(task) {
      return `
        <div class="compact-task-item">
          <div class="task-main">
            <div class="task-icon" style="background: ${task.color};">
              <i class="${task.icon}"></i>
            </div>
            <div class="task-content">
              <div class="task-header">
                <h5 class="task-title">${task.title}</h5>
                <div class="task-actions">
                  <button onclick="showTaskInfo('${task.title}', '${task.description.replace(/'/g, '&#39;')}')" class="info-btn" title="Meer informatie">
                    <i class="fas fa-question"></i>
                  </button>
                </div>
              </div>
              <div class="task-meta">
                <span class="task-time">
                  <i class="fas fa-clock"></i>
                  ${task.time}
                </span>
                <span class="task-type">
                  <i class="fas fa-tag"></i>
                  ${task.type}
                </span>
              </div>
            </div>
            <button onclick="assignTask(${task.id})" class="assign-btn">
              <i class="fas fa-hand-paper"></i>
              <span>Aanmelden</span>
            </button>
          </div>
        </div>
      `;
    }

    function createMyTaskHTML(task) {
      return `
        <div class="my-task-item">
          <div class="task-icon" style="background: var(--success);">
            <i class="${task.icon || 'fas fa-tasks'}"></i>
          </div>
          <div class="task-details">
            <div class="task-header">
              <h4 class="task-title">${task.title}</h4>
              <span class="task-status">Toegewezen</span>
            </div>
            <div class="task-meta">
              <span><i class="fas fa-calendar-alt"></i> ${task.date}</span>
              <span><i class="fas fa-clock"></i> ${task.time}</span>
            </div>
            <button onclick="unassignTask(${task.id})" class="unassign-btn">
              <i class="fas fa-times"></i> Afmelden
            </button>
          </div>
        </div>
      `;
    }

    function toggleDateTasks(dateId) {
      const tasksContainer = document.getElementById(`tasks-${dateId}`);
      const arrow = document.getElementById(`arrow-${dateId}`);
      
      if (tasksContainer.classList.contains('collapsed')) {
        tasksContainer.classList.remove('collapsed');
        arrow.style.transform = 'rotate(180deg)';
      } else {
        tasksContainer.classList.add('collapsed');
        arrow.style.transform = 'rotate(0deg)';
      }
    }

    function showTaskInfo(title, description) {
      const modal = document.getElementById('taskInfoModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalDescription = document.getElementById('modalDescription');
      
      modalTitle.innerHTML = `<i class="fas fa-info-circle"></i> ${title}`;
      modalDescription.innerHTML = description;
      
      modal.style.display = 'flex';
      document.body.style.overflow = 'hidden';
    }

    function closeTaskModal() {
      const modal = document.getElementById('taskInfoModal');
      modal.style.display = 'none';
      document.body.style.overflow = '';
    }

    function assignTask(taskId) {
      if (confirm('Wil je je aanmelden voor deze taak?')) {
        const tasks = JSON.parse(localStorage.getItem('volunteerTasks') || JSON.stringify(volunteerTasks));
        const task = tasks.find(t => t.id === taskId);

        if (task) {
          task.volunteer = 'Test Ouder';
          task.assignedTo = JSON.parse(localStorage.getItem('currentUser') || '{}').email || 'ouder@test.nl';
          localStorage.setItem('volunteerTasks', JSON.stringify(tasks));

          loadTasks();

          if (typeof NotificationManager !== 'undefined') {
            NotificationManager.show(`✅ Je bent aangemeld voor: ${task.title}`, 'success');
          }
        }
      }
    }

    function unassignTask(taskId) {
      if (confirm('Wil je je afmelden voor deze taak?')) {
        const tasks = JSON.parse(localStorage.getItem('volunteerTasks') || JSON.stringify(volunteerTasks));
        const task = tasks.find(t => t.id === taskId);

        if (task) {
          task.volunteer = null;
          task.assignedTo = null;
          localStorage.setItem('volunteerTasks', JSON.stringify(tasks));

          loadTasks();

          if (typeof NotificationManager !== 'undefined') {
            NotificationManager.show(`Je bent afgemeld voor: ${task.title}`, 'info');
          }
        }
      }
    }
  </script>

  <style>
    /* Compact Date Group Cards */
    .date-group-card {
      background: white;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border: 1px solid var(--medium-gray);
      overflow: hidden;
    }

    .date-header {
      background: linear-gradient(135deg, var(--primary-blue), var(--dark-navy));
      color: white;
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .date-header:hover {
      background: linear-gradient(135deg, var(--dark-navy), #0f3460);
    }

    .date-info .date-title {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      font-size: 1rem;
    }

    .date-controls {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .task-count {
      background: rgba(255, 255, 255, 0.2);
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      font-size: 0.8rem;
      font-weight: 600;
    }

    .toggle-arrow {
      transition: transform 0.3s ease;
      font-size: 0.9rem;
    }

    /* Tasks Container */
    .tasks-container {
      padding: 0.75rem;
      max-height: 1000px;
      transition: all 0.4s ease;
      overflow: hidden;
    }

    .tasks-container.collapsed {
      max-height: 0;
      padding: 0 0.75rem;
    }

    /* Compact Task Items */
    .compact-task-item {
      border-bottom: 1px solid var(--soft-gray);
      padding: 0.75rem 0;
    }

    .compact-task-item:last-child {
      border-bottom: none;
    }

    .task-main {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .task-icon {
      width: 36px;
      height: 36px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .task-content {
      flex: 1;
      min-width: 0;
    }

    .task-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 0.25rem;
    }

    .task-title {
      margin: 0;
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--charcoal);
    }

    .task-actions {
      display: flex;
      gap: 0.25rem;
    }

    .info-btn {
      background: rgba(30, 91, 168, 0.1);
      border: 1px solid var(--primary-blue);
      color: var(--primary-blue);
      width: 24px;
      height: 24px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-size: 0.7rem;
      transition: all 0.3s ease;
    }

    .info-btn:hover {
      background: var(--primary-blue);
      color: white;
    }

    .task-meta {
      display: flex;
      gap: 1rem;
      font-size: 0.8rem;
      color: var(--text-gray);
    }

    .task-meta span {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .assign-btn {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: white;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      white-space: nowrap;
    }

    .assign-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
    }

    /* My Tasks */
    .my-task-item {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      border: 1px solid var(--success);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 0.75rem;
      display: flex;
      gap: 0.75rem;
      align-items: flex-start;
    }

    .task-details {
      flex: 1;
    }

    .task-details .task-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.5rem;
    }

    .task-status {
      background: var(--success);
      color: white;
      padding: 0.25rem 0.5rem;
      border-radius: 12px;
      font-size: 0.7rem;
      font-weight: 600;
    }

    .unassign-btn {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      border: none;
      padding: 0.5rem 0.75rem;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
      margin-top: 0.5rem;
      transition: all 0.3s ease;
    }

    .unassign-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.3);
    }

    /* Task Modal */
    .task-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      z-index: 10000;
      align-items: center;
      justify-content: center;
      padding: 1rem;
    }

    .task-modal-content {
      background: white;
      border-radius: 16px;
      max-width: 500px;
      width: 100%;
      max-height: 80vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }

    .task-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1.5rem 1.5rem 0 1.5rem;
      margin-bottom: 1rem;
    }

    .task-modal-header h3 {
      margin: 0;
      color: var(--primary-blue);
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .modal-close-btn {
      background: none;
      border: none;
      font-size: 1.5rem;
      color: var(--text-gray);
      cursor: pointer;
      padding: 0.5rem;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .modal-close-btn:hover {
      background: var(--soft-gray);
      color: var(--charcoal);
    }

    .task-modal-body {
      padding: 0 1.5rem;
      color: var(--charcoal);
      line-height: 1.6;
      font-size: 1rem;
    }

    .task-modal-footer {
      padding: 1.5rem;
      text-align: center;
    }

    /* Mobile Optimizations */
    @media (max-width: 768px) {
      .task-main {
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .assign-btn {
        width: 100%;
        margin-top: 0.5rem;
        justify-content: center;
      }

      .task-meta {
        flex-direction: column;
        gap: 0.25rem;
      }

      .date-header {
        padding: 0.6rem 0.8rem;
      }

      .date-info .date-title {
        font-size: 0.9rem;
      }

      .task-count {
        font-size: 0.7rem;
        padding: 0.2rem 0.4rem;
      }

      .task-title {
        font-size: 0.9rem;
      }
    }

    @media (max-width: 480px) {
      .tasks-container {
        padding: 0.5rem;
      }

      .compact-task-item {
        padding: 0.5rem 0;
      }

      .task-icon {
        width: 32px;
        height: 32px;
        font-size: 0.9rem;
      }

      .task-title {
        font-size: 0.85rem;
      }

      .info-btn {
        width: 20px;
        height: 20px;
        font-size: 0.6rem;
      }

      .assign-btn {
        font-size: 0.75rem;
        padding: 0.4rem 0.6rem;
      }

      .task-modal-content {
        margin: 0.5rem;
        max-height: 90vh;
      }

      .task-modal-header,
      .task-modal-footer {
        padding: 1rem;
      }

      .task-modal-body {
        padding: 0 1rem;
        font-size: 0.9rem;
      }
    }

    /* Click outside modal to close */
    .task-modal {
      backdrop-filter: blur(4px);
    }
  </style>

  <script>
    // Close modal when clicking outside
    document.getElementById('taskInfoModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closeTaskModal();
      }
    });

    // Close modal with escape key
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape') {
        closeTaskModal();
      }
    });
  </script>
</body>
</html>
