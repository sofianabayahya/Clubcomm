<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>v2 Weekevaluatie beoordelen (390 px)</title>
<!-- Ontwerp v2, geen app-code. Venster na "Beoordelen en bevestigen" in Lijn. -->
<link rel="stylesheet" href="../../../public/app/app.css"><link rel="stylesheet" href="ontwerp.css"></head>
<body><div class="sheetvb" style="padding-top:60px"><div class="blad" style="max-width:430px;margin:0 auto">
  <div class="kopbalk"><div>Weekevaluatie week 45<small>Vooruitgang creëren · di, do (vr nog niet gegeven)</small></div><span>✕</span></div>
  <label class="klein" for="c"><b>Conclusie</b> <span class="zacht">(voorstel van ClubComm, pas het aan)</span></label>
  <textarea id="c" rows="4" style="font-size:16px;border:1px solid var(--lijn);border-radius:10px;padding:8px">Het gedrag werd op donderdag zichtbaar en kwam duidelijk terug in de partij; op dinsdag nog deels, met te weinig weerstand.</textarea>
  <div class="tr-ev"><b>Volgende week</b><div class="chips"><button class="chipknop">behouden</button><button class="chipknop aan">één variabele aanpassen</button><button class="chipknop">ander complexiteitsniveau</button></div></div>
  <label class="klein" for="v"><b>Welke variabele?</b></label>
  <input id="v" value="Weerstand: verdediger mag direct druk zetten" style="min-height:44px;font-size:16px;border:1px solid var(--lijn);border-radius:10px;padding:0 10px">
  <button class="knop">Bevestigen</button>
  <small class="zacht klein">Na Bevestigen: status <span class="ostatus ok">Bevestigd</span> in Lijn. De volgende week wordt niet vanzelf aangepast; de keuze staat als voorstel bij de trainingen van volgende week.</small>
</div></div></body></html>
