<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>C2.1 · Krijtbord-blauw verbeterd</title>
<link rel="stylesheet" href="../prototypes/kader.css">
<style>
/* ===== C2.1 — Krijtbord-blauw, verbeterd na review =====
   - Lettertype lokaal (geen Google): Archivo variabel, alleen Latijn, 90 kB.
   - Alle maten in rem: tekstgrootte van de telefoon/browser werkt door (200 %-proef).
   - Eén betekenis per kleur en per vorm (zie Componenten → Betekenis). */
@font-face { font-family: 'Archivo'; src: url(fonts/archivo-latin.woff2) format('woff2'); font-weight: 400 900; font-stretch: 62% 125%; font-display: swap; }
:root {
  /* merk ClubComm (bestaande waarden uit app.css) */
  --navy: #0B2545;      /* het bord: menu, kop. Wit 15,6:1; logo-blauw erop 4,9:1 */
  --blauw: #0869C2;     /* alleen doen en kiezen: hoofdknop, gekozen, link. Wit 5,3:1 */
  --blauw-d: #07589F;
  --logo: #0D88F9;      /* logo en "nu / volgende" (vorm, geen kleine tekst) */
  --ijs: #E7F2FE;       /* gekozen achtergrond, rondjes */
  --krijt: #F5F7FA; --papier: #FFFFFF; --lijn: #D3DEEB; --zacht: #4A5B70; /* zacht op wit 6,9:1 */
  /* status */
  --pion: #F97316; --pion-tekst: #A84D08; /* wacht op jou */
  --grijs: #8A99AB;                        /* wacht op een ander (vorm) */
  --goed: #137333; --fout: #C81E1E;
  /* bloksoorten training (bestaand, training.js BLOKKLEUR) */
  --b-start: #94A3B8; --b-a: #0869C2; --b-b: #137333; --b-s: #F5B041; --b-p: #0B4F7A;
  --club: #B3122E; --club-op: #fff;
  --font: 'Archivo', system-ui, sans-serif;
  --r: .625rem;
}
* { box-sizing: border-box; }
html { font-size: 100%; }
body { margin: 0; background: var(--krijt); color: var(--navy); font: 400 1rem/1.5 var(--font); }
h1, h2, h3 { margin: 0; line-height: 1.1; font-weight: 800; font-stretch: 110%; letter-spacing: -.01em; overflow-wrap: anywhere; hyphens: auto; }
.app, .vlak, .blok, .rij > span { min-width: 0; }
section[data-deel] { padding: 2rem 1.5rem 3.5rem; max-width: 85.375rem; margin: 0 auto; }
body.los section[data-deel] { padding: 0; max-width: none; }
.notitie { color: var(--zacht); max-width: 72ch; }
.hint { color: var(--zacht); max-width: 72ch; }
.kopbalk { display: flex; align-items: center; gap: .625rem; padding: .5rem 1rem; background: var(--nav-bg); color: var(--nav-tekst); min-height: 3.5rem; border-bottom: var(--nav-rand); }
.kopbalk .logo { width: 2.125rem; height: 2.125rem; } .kopbalk .rol { color: var(--nav-zacht); font-weight: 600; }
.tlink { display: inline-flex; align-items: center; min-height: 2.75rem; min-width: 2.75rem; font-weight: 700; text-underline-offset: 3px; }
.app > div, .trgrid > *, .lijstdetail > * { min-width: 0; }
.deelkop { font-size: 2.25rem; margin-bottom: .5rem; }
a { color: var(--blauw); }
:focus-visible { outline: 3px solid var(--logo); outline-offset: 2px; }

/* ---------- Herkenningstekens ---------- */
.logo { width: 2.5rem; height: 2.5rem; border-radius: 22%; display: block; flex: none; }
.logo-vlak { display: inline-flex; flex: none; padding: var(--logo-pad); background: var(--logo-vlak); border-radius: 28%; }
.rail .wacht { filter: drop-shadow(0 0 1.5px #fff) drop-shadow(0 0 1px #fff); }
/* ---------- Kleur van menu en kop: vier varianten (?nav=navy|blauw|licht|wit) ---------- */
:root { --tab-bg: #fff; --tab-rand: #D3DEEB; --tab-tekst: #4A5B70; --tab-actief: #07589F; --tab-actief-bg: transparent; --tab-streep: #0D88F9; --nav-bg: var(--navy); --nav-tekst: #fff; --nav-zacht: #C9D6E6; --nav-actief-bg: #17375F; --nav-actief: #fff; --nav-streep: var(--logo); --nav-rand: 0 none; --logo-vlak: transparent; --logo-pad: 0; }
html[data-nav="blauw"] { --nav-bg: #0869C2; --nav-tekst: #fff; --nav-zacht: #E1EEFC; --nav-actief-bg: #07589F; --nav-actief: #fff; --nav-streep: #fff; --logo-vlak: #fff; --logo-pad: .1875rem; --tab-bg: #0869C2; --tab-rand: #0869C2; --tab-tekst: #E1EEFC; --tab-actief: #fff; --tab-actief-bg: #07589F; --tab-streep: #fff; }
html[data-nav="blauw"][data-vlak="nee"] { --logo-vlak: transparent; --logo-pad: 0; }
html[data-nav="licht"] { --nav-bg: #E7F2FE; --nav-tekst: #0B2545; --nav-zacht: #24456E; --nav-actief-bg: #FFFFFF; --nav-actief: #07589F; --nav-streep: #0D88F9; --nav-rand: 1px solid #C6DDF6; --tab-bg: #E7F2FE; --tab-rand: #C6DDF6; --tab-tekst: #24456E; --tab-actief: #07589F; --tab-actief-bg: #fff; }
/* C · wit (gekozen 7-11): volledig wit, gekozen = blauwe tekst + blauwe streep, geen vlak */
html[data-nav="wit"], html[data-nav="witaccent"] { --nav-bg: #FFFFFF; --nav-tekst: #0B2545; --nav-zacht: #4A5B70; --nav-actief-bg: transparent; --nav-actief: #07589F; --nav-streep: #0869C2; --nav-rand: 1px solid #D3DEEB;
  --tab-bg: #fff; --tab-rand: #D3DEEB; --tab-tekst: #4A5B70; --tab-actief: #07589F; --tab-actief-bg: transparent; --tab-streep: #0869C2;
  --pion: #EA580C; /* donkerder pion: 3,6:1 op wit, 3,3 op krijt, 3,1 op ijs */ }
/* C · wit met subtiel lichtblauw accent: gekozen item en rand in lichtblauw, verder wit */
html[data-nav="witaccent"] { --nav-actief-bg: #E7F2FE; --nav-streep: #0D88F9; --nav-rand: 1px solid #C6DDF6; --tab-rand: #C6DDF6; --tab-actief-bg: #E7F2FE; --tab-streep: #0D88F9; }
/* scheiding navigatie en werkgebied bij wit: rand + zachte schaduw, werkgebied in krijt */
html[data-nav^="wit"] .rail { box-shadow: 1px 0 0 rgba(11,37,69,.04), 4px 0 12px rgba(11,37,69,.05); position: relative; z-index: 1; }
html[data-nav^="wit"] .mobielkop, html[data-nav^="wit"] .kopbalk { box-shadow: 0 1px 3px rgba(11,37,69,.06); position: relative; z-index: 1; }
html[data-nav^="wit"] .tabs { box-shadow: 0 -1px 3px rgba(11,37,69,.06); }
html[data-nav="witaccent"] .tabs a[aria-current] { background: none; }
html[data-nav="witaccent"] .tabs a[aria-current] svg { background: #E7F2FE; border-radius: 999px; padding: .2rem .9rem; box-sizing: content-box; margin: -.2rem 0; }
html[data-nav^="wit"] .mail-kop { background: #fff; color: var(--navy); border-bottom: 1px solid var(--lijn); }
.pion { display: inline-block; width: 0; height: 0; border-left: .5625rem solid transparent; border-right: .5625rem solid transparent; border-bottom: 1rem solid var(--pion); flex: none; }
.pion.ander { border-bottom-color: var(--grijs); }
.vink { width: 1.125rem; height: 1.125rem; border-radius: 50%; background: var(--goed); flex: none; position: relative; }
.vink::after { content: ''; position: absolute; left: .34rem; top: .2rem; width: .3rem; height: .55rem; border: solid #fff; border-width: 0 .14rem .14rem 0; transform: rotate(45deg); }
.persoon { display: inline-grid; place-items: center; width: 2.5rem; height: 2.5rem; border-radius: 50%; background: var(--ijs); color: var(--navy); font-weight: 800; font-size: .875rem; font-stretch: 90%; flex: none; box-shadow: inset 0 0 0 2px #C6DDF6; }
.clubbadge { display: inline-grid; place-items: center; width: 2.25rem; height: 2.25rem; border-radius: .375rem .375rem 50% 50%; background: var(--club); color: var(--club-op); font: 800 .75rem/1 var(--font); flex: none; box-shadow: 0 0 0 2px #fff; }
.haltes { display: flex; align-items: center; max-width: 100%; }
.halte { width: 1.75rem; height: 1.75rem; border-radius: 50%; border: 2px solid var(--blauw); display: grid; place-items: center; font-weight: 800; font-size: .875rem; color: var(--blauw); background: #fff; flex: none; }
.halte.af { background: var(--blauw); color: #fff; }
.halte.volgend { border: 3px solid var(--logo); color: var(--navy); }
.spoor { flex: 1; height: 3px; min-width: .5rem; background: repeating-linear-gradient(90deg, #B9C8DA 0 6px, transparent 6px 11px); }
.spoor.af { background: var(--blauw); }

/* ---------- Schil ---------- */
.app { display: grid; grid-template-columns: 5.25rem 1fr; min-height: 51rem; background: var(--krijt); border-radius: .75rem; overflow: hidden; box-shadow: 0 0 0 1px var(--lijn); }
body.los .app { border-radius: 0; box-shadow: none; min-height: 100vh; }
.rail { background: var(--nav-bg); color: var(--nav-tekst); border-right: var(--nav-rand); display: flex; flex-direction: column; align-items: center; padding: .875rem 0; gap: .25rem; }
.rail .logo-vlak { margin-bottom: .875rem; }
.rail a { width: 4.5rem; min-height: 3.5rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; color: var(--nav-zacht); text-decoration: none; font-size: .8125rem; font-weight: 700; border-radius: .5rem; position: relative; }
.rail a svg, .tabs a svg { width: 1.375rem; height: 1.375rem; }
.rail a[aria-current] { background: var(--nav-actief-bg); color: var(--nav-actief); }
.rail a[aria-current]::before { content: ''; position: absolute; left: -.375rem; top: .75rem; bottom: .75rem; width: 3px; border-radius: 2px; background: var(--nav-streep); }
.rail .wacht, .tabs .wacht { position: absolute; top: .4rem; right: 1rem; border-bottom-width: .75rem; border-left-width: .4rem; border-right-width: .4rem; }
.rail .clubbadge { margin-top: auto; }
.hoofd { padding: 1.625rem 2rem 2.5rem; min-width: 0; }
.kop { display: flex; align-items: flex-end; gap: 1rem; justify-content: space-between; flex-wrap: wrap; margin-bottom: 1.25rem; }
.kop h1 { font-size: 2.25rem; font-stretch: 115%; } .kop p { margin: .25rem 0 0; color: var(--zacht); }
.tabs, .mobielkop { display: none; }

/* ---------- Bouwstenen ---------- */
.vlak { background: var(--papier); border-radius: var(--r); box-shadow: 0 0 0 1px var(--lijn); }
.blok { padding: 1.125rem 1.375rem; }
.blok + .blok { border-top: 2px solid var(--lijn); }
.blokkop { font-size: 1.375rem; margin-bottom: .5rem; display: flex; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.blokkop small { font: 600 1rem/1 var(--font); font-stretch: 100%; color: var(--zacht); }
.rij { display: grid; grid-template-columns: 1.25rem 1fr auto; gap: .75rem; align-items: start; padding: .75rem 0; border-top: 1px dashed var(--lijn); text-decoration: none; color: inherit; min-height: 3.5rem; }
.rij:first-child, .blokkop + .rij { border-top: 0; }
.rij > .pion, .rij > .vink { margin-top: .2rem; }
.rij b { display: block; font-weight: 700; overflow-wrap: anywhere; }
.rij .sub { display: block; color: var(--zacht); }
.rij .pijl { color: var(--blauw); font-weight: 800; align-self: center; font-size: 1.25rem; }
.rij.p { grid-template-columns: 2.5rem 1fr auto; align-items: center; }
.knoppen { display: flex; gap: .5rem; margin-top: .625rem; flex-wrap: wrap; }
.knop { display: inline-flex; align-items: center; justify-content: center; gap: .5rem; min-height: 3rem; padding: 0 1.25rem; border-radius: .5rem; border: 0; font: 700 1rem/1.1 var(--font); cursor: pointer; text-decoration: none; text-align: center; transition: transform .08s, background .15s; }
.knop:active { transform: translateY(1px); }
.knop.hoofd-k { background: var(--blauw); color: #fff; } .knop.hoofd-k:hover { background: var(--blauw-d); }
.knop.tweede { background: #fff; color: var(--blauw); box-shadow: inset 0 0 0 2px var(--blauw); }
.knop.gevaar { background: #fff; color: var(--fout); box-shadow: inset 0 0 0 2px #EBB4B4; }
.knop.klein { min-height: 2.75rem; padding: 0 .875rem; }
.knop.stil { background: none; color: var(--blauw); text-decoration: underline; text-underline-offset: 3px; padding: 0 .25rem; min-height: 2.75rem; }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
.chip { min-height: 2.75rem; padding: 0 1rem; display: inline-flex; align-items: center; border-radius: 999px; text-decoration: none; color: var(--navy); font-weight: 700; box-shadow: inset 0 0 0 1px var(--lijn); background: #fff; }
.chip[aria-pressed="true"] { background: var(--ijs); color: var(--blauw-d); box-shadow: inset 0 0 0 2px var(--blauw); }
.label { display: inline-flex; align-items: center; gap: .375rem; font-size: .875rem; font-weight: 700; padding: .125rem .5rem; border-radius: .375rem; background: #EEF2F6; color: var(--zacht); white-space: nowrap; }
.label.thuis::before { content: ''; width: .5rem; height: .5rem; border-radius: 2px 2px 50% 50%; background: var(--club); }
.label.af { background: #FDE8E8; color: var(--fout); text-decoration: line-through; }
.stap { font-weight: 700; color: var(--pion-tekst); }
.tweekol { display: grid; grid-template-columns: 1.15fr 1fr; }
.tweekol > .blok { border-right: 2px solid var(--lijn); }
.tellers { display: flex; gap: 1.5rem; flex-wrap: wrap; padding: .75rem 1.375rem; color: var(--zacht); border-bottom: 2px solid var(--lijn); }
.tellers b { color: var(--navy); font-size: 1.375rem; font-stretch: 90%; margin-right: .25rem; }
.zoek { display: flex; align-items: center; min-height: 3rem; padding: 0 .875rem; background: #fff; border-radius: .5rem; box-shadow: inset 0 0 0 1px var(--lijn); color: var(--zacht); margin-bottom: .75rem; }
.seg { display: flex; gap: .375rem; margin-bottom: 1rem; overflow-x: auto; }
.seg a { min-height: 2.75rem; padding: 0 1rem; display: flex; align-items: center; border-radius: 999px; text-decoration: none; color: var(--navy); font-weight: 700; box-shadow: inset 0 0 0 1px var(--lijn); background: #fff; white-space: nowrap; }
.seg a[aria-current] { background: var(--ijs); color: var(--blauw-d); box-shadow: inset 0 0 0 2px var(--blauw); }

/* Trainers */
.lijstdetail { display: grid; grid-template-columns: minmax(20rem, 26rem) 1fr; gap: 1.25rem; align-items: start; }
.trlijst .rij { padding: .625rem .875rem; }
.trlijst .rij[aria-current] { background: var(--ijs); }
.detail { padding: 1.375rem 1.5rem; }
.wie { display: flex; gap: .875rem; align-items: center; margin-bottom: 1.125rem; }
.wie .persoon { width: 3.5rem; height: 3.5rem; font-size: 1.125rem; }
.wie h2 { font-size: 1.75rem; overflow-wrap: anywhere; }
.vier { list-style: none; margin: .5rem 0 1.25rem; padding: 0; display: grid; gap: .25rem; }
.vier li { display: grid; grid-template-columns: 1.75rem 1fr auto; gap: .75rem; align-items: center; min-height: 2.75rem; }
.vier .wanneer { color: var(--zacht); }
.tijdlijn { border-left: 3px solid var(--ijs); margin-left: .75rem; padding-left: 1.25rem; }
.tijdlijn .m { position: relative; padding: .375rem 0 .875rem; }
.tijdlijn .m::before { content: ''; position: absolute; left: -1.8rem; top: .55rem; width: .875rem; height: .875rem; border-radius: 50%; background: #fff; border: 3px solid var(--blauw); }
.tijdlijn .m.af::before { background: var(--blauw); }

/* Training: de bestaande balk (veldtijd − organisatie = oefentijd), in C2.1-vorm */
.tijd { padding: .875rem 1rem; }
.tijd-r { display: flex; gap: .5rem 1rem; flex-wrap: wrap; align-items: baseline; margin-bottom: .5rem; }
.tijd-r b { font-size: 1.25rem; font-stretch: 90%; }
.balk { position: relative; display: flex; height: 2.25rem; border-radius: .375rem; overflow: hidden; background: #fff; box-shadow: inset 0 0 0 1px var(--lijn); }
.balk i { display: flex; align-items: center; justify-content: center; height: 100%; min-width: 2px; border-right: 2px solid #fff; font: 800 .8125rem/1 var(--font); font-stretch: 85%; font-style: normal; color: #fff; overflow: hidden; white-space: nowrap; }
.balk i:last-of-type { border-right: 0; }
.balk i.licht { color: var(--navy); }
.balk .vrij { background: repeating-linear-gradient(90deg, transparent 0 6px, #EEF2F6 6px 8px); color: var(--zacht); }
.balk .org { background: repeating-linear-gradient(135deg, #CBD5E1 0 4px, #E2E8F0 4px 8px); color: var(--navy); }
.balk .over { background: repeating-linear-gradient(135deg, #B45309 0 4px, #F59E0B 4px 8px); }
.balk .grens { position: absolute; top: -2px; bottom: -2px; width: 3px; background: var(--navy); }
.tijd-ok { color: var(--goed); font-weight: 700; display: block; margin-top: .375rem; }
.tijd-waarsch { margin-top: .5rem; padding: .625rem .75rem; border-radius: .5rem; background: #FFF4E5; color: #7A3B06; }
.oef { display: grid; grid-template-columns: minmax(2.5rem, auto) minmax(0, 1fr) auto; gap: .75rem; align-items: center; padding: .625rem 1rem; border-top: 1px dashed var(--lijn); min-height: 3.5rem; }
.oef:first-child { border-top: 0; }
.oef .code { font-weight: 800; font-stretch: 85%; font-size: 1.125rem; display: flex; align-items: center; gap: .375rem; }
.oef .code::before { content: ''; width: .5rem; height: 1.5rem; border-radius: 2px; background: var(--k, var(--b-a)); }
.oef b { font-weight: 700; overflow-wrap: anywhere; } .oef .sub { display: block; color: var(--zacht); }
.oef .min { font-weight: 800; font-stretch: 85%; font-size: 1.25rem; white-space: nowrap; }
.oef.leeg b { color: var(--zacht); font-weight: 400; font-style: italic; }
.tekening { padding: .75rem; } .tekening svg { width: 100%; display: block; height: auto; }
.toast { display: flex; gap: .75rem; align-items: center; justify-content: space-between; background: var(--navy); color: #fff; border-radius: .5rem; padding: .375rem .375rem .375rem 1rem; margin-top: .75rem; }
.toast .knop { background: transparent; color: #fff; box-shadow: inset 0 0 0 2px #5B7BA3; min-height: 2.75rem; }

/* Tekentool (bestaande indeling, nieuwe stijl) */
.tt { background: #fff; border-radius: var(--r); box-shadow: 0 0 0 1px var(--lijn); overflow: hidden; }
.tt-balk { display: flex; gap: .5rem; padding: .625rem; align-items: center; flex-wrap: wrap; border-bottom: 1px solid var(--lijn); }
.tt-balk .rechts { margin-left: auto; display: flex; gap: .5rem; }
.tt-ik { min-width: 2.75rem; }
.tt-gereed { display: flex; gap: .375rem; padding: .625rem; overflow-x: auto; border-bottom: 1px solid var(--lijn); mask-image: linear-gradient(90deg, #000 85%, transparent); -webkit-mask-image: linear-gradient(90deg, #000 85%, transparent); }
.tt-gereed button { flex: none; min-width: 4.5rem; min-height: 4rem; border: 0; border-radius: .5rem; background: var(--krijt); font: 700 .875rem/1.1 var(--font); color: var(--navy); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .375rem; }
.tt-gereed button[aria-pressed="true"] { background: var(--ijs); box-shadow: inset 0 0 0 2px var(--blauw); color: var(--blauw-d); }
.tt-gereed svg { width: 1.5rem; height: 1.5rem; }
.tt-hulp { padding: .625rem .875rem; color: var(--zacht); }
.tt-veld { background: #2E7D4F; padding: .75rem; } .tt-veld svg { width: 100%; display: block; height: auto; }

/* Ouder */
.act-kop { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; flex-wrap: wrap; }
.act-kop b { font-size: 1.25rem; font-stretch: 105%; }
.act-tijden { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, max-content)); gap: .25rem 1.25rem; justify-content: start; margin: .5rem 0; }
.act-tijden span { color: var(--zacht); } .act-tijden b { display: block; color: var(--navy); font-size: 1.25rem; font-stretch: 90%; }
.keuze { display: grid; grid-template-columns: repeat(auto-fit, minmax(8rem, 1fr)); gap: .5rem; margin-top: .5rem; }
.keuze .knop[aria-pressed="true"] { background: var(--ijs); color: var(--blauw-d); box-shadow: inset 0 0 0 2px var(--blauw); }

/* Staten */
.staten { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; }
.leeg-staat { text-align: center; padding: 1.5rem 1rem; color: var(--zacht); }
.laden { height: .875rem; border-radius: .25rem; background: linear-gradient(90deg, #EEF2F6 25%, #F7F9FB 50%, #EEF2F6 75%); background-size: 200% 100%; animation: glans 1.4s linear infinite; margin: .5rem 0; }
@keyframes glans { to { background-position: -200% 0; } }
.fout-staat { padding: 1rem; border-radius: .5rem; background: #FDECEC; color: #7E1414; }

/* Kit */
.kit { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1rem; }
.kitvak { padding: 1.125rem; } .kitvak h3 { font-size: 1.25rem; margin-bottom: .75rem; }
.betekenis { width: 100%; border-collapse: collapse; }
.betekenis th, .betekenis td { text-align: left; padding: .5rem .5rem; border-top: 1px solid var(--lijn); vertical-align: middle; }
.betekenis th { font-size: .875rem; color: var(--zacht); }
.vb { display: inline-flex; align-items: center; gap: .5rem; }

/* Mail en print */
.mail { max-width: 37.5rem; margin: 0 auto; background: #fff; border-radius: var(--r); box-shadow: 0 0 0 1px var(--lijn); overflow: hidden; }
.mail-kop { display: flex; align-items: center; gap: .75rem; padding: 1rem 1.5rem; background: var(--navy); color: #fff; }
.mail-kop .clubbadge { margin-left: auto; }
.mail-tekst { padding: 1.5rem; } .mail-tekst h2 { font-size: 1.5rem; margin-bottom: .75rem; }
.mail-voet { padding: 1rem 1.5rem; color: var(--zacht); font-size: .875rem; border-top: 1px solid var(--lijn); }
.print { background: #fff; width: 49.6rem; max-width: 100%; padding: 2rem; box-shadow: 0 0 0 1px var(--lijn); filter: grayscale(1); }
.print h2 { font-size: 1.5rem; } .print .oef { padding: .5rem 0; }

/* beweging: één moment — de haltes van het traject lopen één keer vol */
@keyframes vul { from { transform: scaleX(0); } }
.spoor.af { transform-origin: left; animation: vul .6s ease-out both; }

/* ---------- Telefoon ---------- */
@media (max-width: 56.25em) {
  section[data-deel] { padding: 1.25rem 1rem 2.5rem; }
  .app { grid-template-columns: 1fr; min-height: 0; }
  .rail { display: none; }
  .mobielkop { display: flex; align-items: center; gap: .625rem; padding: calc(.5rem + env(safe-area-inset-top)) 1rem .5rem; background: var(--nav-bg); color: var(--nav-tekst); min-height: 3.5rem; border-bottom: var(--nav-rand); }

  .tabs { display: grid; grid-template-columns: repeat(5, 1fr); background: var(--tab-bg); border-top: 1px solid var(--tab-rand); padding-bottom: env(safe-area-inset-bottom); position: sticky; bottom: 0; }
  body:not(.los) .tabs { position: relative; }
  body.los .tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; }
  .tabs a { min-height: 3.625rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .2rem; color: var(--tab-tekst); text-decoration: none; font-size: .8125rem; font-weight: 700; position: relative; }
  .tabs a[aria-current] { color: var(--tab-actief); background: var(--tab-actief-bg); box-shadow: inset 0 3px 0 var(--tab-streep); }
  .tabs .wacht { right: calc(50% - 1.3rem); top: .35rem; }
  .lijstdetail { grid-template-columns: 1fr; } .detail-paneel { display: none; }

}

document.getElementById('trainerhome').innerHTML = schil('home', `
  <div class="kop"><div><h1>Hoi Dennis</h1><p>Vrijdag 6 november · O9-1</p></div></div>

// ---------- Trainers: lijst + dossier (Besluit 171, 177, 178) ----------

  ['DP', 'Dennis Peters', 'O9-1', 'traject 1/2 · volgend za 14 nov', 0, 0], ['HD', 'Hasan van Dijk', 'O11-1', '<span class="stap">③ traject starten</span>', 0, 1],
  ['LJ', 'Lotte Jansen', 'O7-1', 'traint vooral voor het plezier', 0, 0], ['MK', 'Mehmet Kaya', 'O12-2', 'kennismaking nog niet gestuurd', 0, 0], ['SB', 'Samira Brouwer', 'O8-1', 'traject 2/3 · volgend za 21 nov', 0, 0]];
document.getElementById('trainers').innerHTML = schil('trainers', `

// ---------- Trainingsbalk volgens de bestaande rekenregel (training.js r. 161–176) ----------
const KL = { Start: 'var(--b-start)', A: 'var(--b-a)', B: 'var(--b-b)', S: 'var(--b-s)', P: 'var(--b-p)' };
const LICHT = { Start: 1, S: 1 };
const balk = ({ veld = null, org = null, blokken }) => {
  const oefen = veld == null ? null : veld - (org || 0); const inp = blokken.reduce((s, b) => s + b.min, 0);
  const schaal = Math.max(veld || 0, inp + (org || 0), 1); let tel = 0; const delen = [];
  const label = (txt, n) => (n / schaal >= 0.075 ? txt : '');
  blokken.forEach((b) => { const binnen = oefen == null ? b.min : Math.max(0, Math.min(b.min, oefen - tel));
    if (binnen) delen.push(`<i class="${LICHT[b.soort] ? 'licht' : ''}" style="flex:${binnen};background:${KL[b.soort]}">${label(b.code, binnen)}</i>`);
    if (b.min > binnen) delen.push(`<i class="over" style="flex:${b.min - binnen}"></i>`); tel += b.min; });
  if (oefen != null && tel < oefen) delen.push(`<i class="vrij" style="flex:${oefen - tel}">${label(`${oefen - tel} vrij`, oefen - tel)}</i>`);
  if (veld != null && org) { const rest = Math.max(0, veld - Math.max(tel, oefen)); if (rest) delen.push(`<i class="org" style="flex:${rest}">${label('org.', rest)}</i>`); }
  const grens = oefen != null && veld ? `<span class="grens" style="left:calc(${((oefen / schaal) * 100).toFixed(2)}% - 1px)"></span>` : '';
  const over = oefen == null ? 0 : inp - oefen;
  const kop = veld != null ? `<span><b>${veld}</b> veldtijd</span><span>− <a class="tlink" href="#">${org ? `${org} organisatie` : '+ organisatie'}</a></span><span>= <b>${oefen}</b> oefentijd</span>` : `<span><b>${inp}</b> min ingepland</span>`;
  const regel = oefen == null ? (blokken.length ? '<span class="hint" style="display:block;margin-top:.375rem">Geen begin- en eindtijd in de kalender: ClubComm telt alleen de minuten op.</span>' : '')
    : over > 0 ? `<div class="tijd-waarsch" role="status"><b>${inp} van ${oefen} min ingepland: ${over} te veel.</b> ${org ? 'In de organisatietijd' : 'Buiten de veldtijd'} valt: de laatste ${over} min van de partij. Je kunt zo doorgaan.</div>`
    : blokken.length ? `<span class="tijd-ok">✓ ${inp} van ${oefen} min ingepland${over < 0 ? ` · nog ${-over} min vrij` : ' · past precies'}</span>` : '';
  return `<div class="tijd"><div class="tijd-r">${kop}</div>${blokken.length ? `<div class="balk" role="img" aria-label="${inp} minuten ingepland${oefen != null ? `, ${oefen} oefentijd` : ''}${org ? `, ${org} organisatie` : ''}">${delen.join('')}${grens}</div>` : '<p class="hint" style="margin:.25rem 0 0">Nog geen vormen gekozen.</p>'}${regel}</div>`; };
const B = (code, soort, naam, min, sp = '') => ({ code, soort, naam, min, sp });
const STD = [B('Start', 'Start', 'Rondo 5 tegen 2', 10, '7 spelers'), B('A1', 'A', 'Passen in driehoeken', 12, '9 spelers'), B('A2', 'A', 'Positiespel 5 tegen 3 met doelen', 14, '8 spelers'), B('B1', 'B', 'Afwerken na kaats', 12, '10 spelers'), B('P', 'P', 'Partij 6 tegen 6', 20, '12 spelers')];

    <div class="vlak kitvak"><h3>Beweging</h3><p class="hint" style="margin:0">Eén moment: bij openen lopen de gevulde haltes van het traject één keer vol (600 ms). Knop zakt 1 px bij tikken. Laden: zachte glans. Bij <i>Beperk beweging</i> staat alles meteen stil.</p></div>
  </div>`;
</script>
<script>addEventListener('load', () => { const k = document.querySelector('.kader'); if (!k) return; const q = new URLSearchParams(location.search);
  const s = document.createElement('span'); s.innerHTML = 'Navigatie: ' + [['navy', 'Navy'], ['blauw', 'A blauw'], ['licht', 'B lichtblauw'], ['wit', 'C wit']].map(([v, t]) => { q.set('nav', v); return `<a href="?${q}" style="margin-left:6px${document.documentElement.dataset.nav === v ? ';font-weight:800' : ''}">${t}</a>`; }).join('');
  k.insertBefore(s, k.children[1]); });</script>
<script src="../prototypes/kader.js"></script>
</body>
