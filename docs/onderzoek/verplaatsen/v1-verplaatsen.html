<!doctype html>
<html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verplaatsen naar een andere plek (390 px)</title>
<!-- Onderzoek, geen app-code. Het bestaande venster van een geplaatste vorm, met één regel erbij: Verplaatsen naar. -->
<link rel="stylesheet" href="../../../public/app/app.css"><link rel="stylesheet" href="ontwerp.css"></head>
<body><div class="sheetvb" style="padding-top:40px"><div class="blad">
  <b style="font-size:19px">Aannemen en opendraaien (droog)</b>
  <span class="zacht klein">Staat nu op <b>Start</b> · 8 min</span>
  <div class="verpl"><b class="klein">Verplaatsen naar <span class="nieuw">nieuw</span></b>
    <div class="chips">
      <button class="plekchip nu" disabled><b>Start</b><small>hier</small></button>
      <button class="plekchip"><b>A1</b><small>leeg · 6 min</small></button>
      <button class="plekchip"><b>A2</b><small>Rondo vooruit</small></button>
      <button class="plekchip"><b>B1</b><small>leeg · 6 min</small></button>
      <button class="plekchip"><b>B2</b><small>leeg · 10 min</small></button>
      <button class="plekchip"><b>Partij</b><small>leeg · 22 min</small></button></div>
    <small class="zacht klein">Lege plek: de vorm gaat erheen. Bezette plek: de twee wisselen. Minuten, variant, leerniveau en notitie gaan mee.</small></div>
  <div class="twee"><div><label class="klein"><b>Minuten (gepland)</b></label><div style="border:1px solid var(--lijn);border-radius:10px;min-height:44px;display:flex;align-items:center;padding:0 12px">8</div></div>
    <div><label class="klein"><b>Notitie</b></label><div style="border:1px solid var(--lijn);border-radius:10px;min-height:44px;display:flex;align-items:center;padding:0 12px" class="zacht">accent opendraaien</div></div></div>
  <div class="chips"><span class="klein"><b>Leerniveau</b></span><button class="chipknop">Voorstel</button><button class="chipknop aan">Uitvoeren</button><button class="chipknop">Herkennen</button></div>
  <button class="knop vol">Klaar</button>
  <div class="knoppen"><button class="knop licht">↑ Omhoog</button><button class="knop licht">↓ Omlaag</button><button class="knop licht">Vorm bekijken</button><button class="knop licht">Dupliceren</button><button class="knop licht" style="color:var(--rood)">Weghalen</button></div>
</div></div></body></html>
