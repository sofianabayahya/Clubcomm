
<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTV Connect - Registreer via QR</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div style="text-align: center; padding: 2rem; min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center;">
    <div style="background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 400px;">
      <img src="attached_assets/buitenveldert-logo_1749246007134.png" alt="BTV Logo" style="width: 80px; margin-bottom: 1rem;">
      
      <h1 style="color: #1e5ba8; margin-bottom: 1rem;">
        <i class="fas fa-mobile-alt"></i> ClubComm App
      </h1>
      
      <p style="color: #64748b; margin-bottom: 2rem;">
        Je bent uitgenodigd om je te registreren voor de ClubComm ouder app
      </p>

      <!-- QR Code placeholder -->
      <div style="background: #f8fafc; padding: 2rem; border-radius: 12px; margin-bottom: 2rem;">
        <div style="width: 200px; height: 200px; background: white; border: 2px solid #e1e5e9; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
          <div style="text-align: center; color: #64748b;">
            <i class="fas fa-qrcode" style="font-size: 3rem; margin-bottom: 0.5rem;"></i>
            <div>QR Code</div>
            <small>Scan met je telefoon</small>
          </div>
        </div>
      </div>

      <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1.5rem;">
        Scan deze QR code met je telefoon camera of klik op de knop hieronder
      </p>

      <button onclick="window.location.href='registratie.html'" class="btn" style="width: 100%; margin-bottom: 1rem;">
        <i class="fas fa-user-plus"></i> Direct Registreren
      </button>

      <small style="color: #64748b;">
        Al een account? <a href="index.html" style="color: #1e5ba8;">Inloggen</a>
      </small>
    </div>
  </div>

  <script>
    // In real app, generate QR code that links to registratie.html
    // QR code would contain: https://jouw-app.replit.app/registratie.html?ref=qr&team=O10-1
    console.log('QR Registration page loaded');
  </script>
</body>
</html>
