# ClubComm — automatische tests bij elke wijziging (Besluit 88). Rood = niet samenvoegen met main.
name: Tests
on:
  push:
    branches: [main]
  pull_request: # werkbranches: alleen via de pull request (één run, één mail bij een fout)
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: testrapport
          path: test-results/
          retention-days: 7
