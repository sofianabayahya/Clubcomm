<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClubComm - Berichten</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .messages-header {
      background: linear-gradient(135deg, #1e40af, #1e3a8a);
      color: white;
      padding: 1rem;
      margin: -1rem -1rem 1rem -1rem;
      text-align: center;
    }

    .message-tabs {
      display: flex;
      background: white;
      border-radius: 12px;
      margin-bottom: 1rem;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .message-tab {
      flex: 1;
      padding: 1rem;
      text-align: center;
      background: #f8fafc;
      color: #475569;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: all 0.3s ease;
      position: relative;
    }

    .message-tab.active {
      background: #1e40af;
      color: white;
    }

    .message-tab:not(.active):hover {
      background: #e2e8f0;
      color: #1e293b;
    }

    .tab-badge {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: #ef4444;
      color: white;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .messages-container {
      min-height: 300px;
    }

    .message-item {
      background: white;
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      border-left: 4px solid #e2e8f0;
      transition: all 0.3s ease;
    }

    .message-item:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 16px rgba(0,0,0,0.15);
    }

    .message-item.unread {
      border-left-color: #1e40af;
      background: linear-gradient(135deg, #f8fafc, #ffffff);
    }

    .message-item.urgent {
      border-left-color: #ef4444;
      background: linear-gradient(135deg, #fef2f2, #ffffff);
    }

    .message-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 0.75rem;
    }

    .message-title {
      font-weight: 600;
      color: #1e293b;
      font-size: 1rem;
      margin: 0 0 0.25rem 0;
    }

    .message-meta {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.8rem;
      color: #64748b;
    }

    .message-content {
      color: #374151;
      line-height: 1.6;
      margin-bottom: 0.75rem;
    }

    .message-actions {
      display: flex;
      gap: 0.5rem;
      justify-content: flex-end;
    }

    .message-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .message-btn.primary {
      background: #1e40af;
      color: white;
    }

    .message-btn.secondary {
      background: #f1f5f9;
      color: #475569;
    }

    .message-btn:hover {
      transform: translateY(-1px);
    }

    .empty-state {
      text-align: center;
      padding: 3rem 1rem;
      color: #64748b;
    }

    .empty-state i {
      font-size: 3rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .compact-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 0.75rem;
      border-radius: 12px;
      margin-bottom: 1rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .toolbar-btn {
      padding: 0.5rem 1rem;
      border: none;
      border-radius: 8px;
      background: #f1f5f9;
      color: #475569;
      cursor: pointer;
      font-size: 0.8rem;
      transition: all 0.3s ease;
    }

    .toolbar-btn:hover {
      background: #e2e8f0;
      transform: translateY(-1px);
    }

    .toolbar-btn.active {
      background: #1e40af;
      color: white;
    }

    @media (max-width: 768px) {
      .messages-header {
        margin: -0.75rem -0.75rem 1rem -0.75rem;
      }

      .message-tabs {
        margin: 0 -0.75rem 1rem -0.75rem;
        border-radius: 0;
      }

      .message-tab {
        padding: 0.75rem 0.5rem;
        font-size: 0.9rem;
      }

      .compact-toolbar {
        padding: 0.5rem;
        margin: 0 -0.75rem 1rem -0.75rem;
        border-radius: 0;
      }

      .toolbar-btn {
        padding: 0.4rem 0.6rem;
        font-size: 0.7rem;
      }

      .message-item {
        margin: 0 -0.75rem 1rem -0.75rem;
        border-radius: 0;
        border-left: none;
        border-top: 4px solid #e2e8f0;
      }

      .message-item.unread {
        border-top-color: #1e40af;
      }

      .message-item.urgent {
        border-top-color: #ef4444;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="header-content">
      <a href="ouderportaal.html" class="back-link">
        <i class="fas fa-home"></i> Home
      </a>
      <div style="flex: 1; text-align: center;">
        <h1 class="header-title">
          <i class="fas fa-comments"></i> Berichten
        </h1>
      </div>
      <div style="display: flex; gap: 0.5rem; align-items: center;">
        <button onclick="window.location.href='profiel.html'" style="background: var(--soft-gray); color: var(--primary-blue); border: none; width: 44px; height: 44px; border-radius: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s ease;" title="Profiel">
          <i class="fas fa-user-circle" style="font-size: 1.2rem;"></i>
        </button>
        <button onclick="logout()" class="logout-btn" title="Uitloggen">
          <i class="fas fa-sign-out-alt"></i>
        </button>
      </div>
    </div>
  </header>

  <div class="section">
    <div class="messages-header">
      <h2 style="margin: 0; font-size: 1.2rem;">📱 Bericht Centrum</h2>
      <p style="margin: 0.5rem 0 0 0; opacity: 0.9; font-size: 0.9rem;">Alle communicatie op één plek</p>
    </div>

    <!-- Message Type Tabs -->
    <div class="message-tabs">
      <button class="message-tab active" data-type="personal" onclick="switchTab('personal')">
        <i class="fas fa-user"></i>
        <div>Persoonlijk</div>
        <div class="tab-badge" id="personalBadge" style="display: none;">0</div>
      </button>
      <button class="message-tab" data-type="general" onclick="switchTab('general')">
        <i class="fas fa-bullhorn"></i>
        <div>Club Nieuws</div>
        <div class="tab-badge" id="generalBadge" style="display: none;">0</div>
      </button>
    </div>

    <!-- Compact Toolbar -->
    <div class="compact-toolbar">
      <div>
        <button class="toolbar-btn" onclick="refreshMessages()">
          <i class="fas fa-sync-alt"></i> Vernieuwen
        </button>
        <button class="toolbar-btn" onclick="markAllAsRead()">
          <i class="fas fa-check-double"></i> Alles gelezen
        </button>
      </div>
      <div>
        <button class="toolbar-btn" id="filterUnread" onclick="toggleFilter('unread')">
          <i class="fas fa-eye"></i> Ongelezen
        </button>
      </div>
    </div>

    <!-- Messages Container -->
    <div class="messages-container" id="messagesContainer">
      <!-- Messages will be loaded here -->
    </div>
  </div>

  <!-- Fixed Bottom Navigation -->
  <nav class="menubalk" role="navigation" aria-label="Hoofdnavigatie">
    <button type="button" class="nav-item" onclick="navigateToPage('ouderportaal.html')" aria-label="Dashboard pagina">
      <i class="fas fa-home" aria-hidden="true"></i>
      <span>Dashboard</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('overzicht.html')" aria-label="Planning & Overzicht">
      <i class="fas fa-calendar-alt" aria-hidden="true"></i>
      <span>Planning</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('vervoer.html')" aria-label="Vervoer pagina">
      <i class="fas fa-car" aria-hidden="true"></i>
      <span>Vervoer</span>
    </button>
    <button type="button" class="nav-item active" onclick="navigateToPage('prikbord.html')" aria-label="Berichten pagina - huidige pagina" aria-current="page">
      <i class="fas fa-comments" aria-hidden="true"></i>
      <span>Berichten</span>
    </button>
    <button type="button" class="nav-item" onclick="navigateToPage('taken.html')" aria-label="Taken pagina">
      <i class="fas fa-tasks" aria-hidden="true"></i>
      <span>Taken</span>
    </button>
  </nav>

  <script src="script.js"></script>
  <script>
    // Simple message management
    let currentTab = 'personal';
    let showOnlyUnread = false;

    // Initialize on page load
    document.addEventListener('DOMContentLoaded', function() {
      initializeMessages();
      loadMessages();
      updateBadges();
    });

    function initializeMessages() {
      // Initialize demo messages if they don't exist
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      const userEmail = currentUser.email || 'ouder@test.nl';
      const personalKey = `parent_notifications_${userEmail}`;

      if (!localStorage.getItem(personalKey)) {
        const demoPersonalMessages = [
          {
            id: Date.now() - 1000,
            type: 'trainer_feedback',
            title: '⭐ Geweldige training vandaag!',
            message: 'Jesse heeft vandaag uitstekend getraind. Zijn techniek verbetert zichtbaar en hij toont veel inzet tijdens de oefeningen. Ga zo door!',
            sender: 'Marco van der Berg',
            senderRole: 'Trainer O10-1',
            timestamp: new Date(Date.now() - 2 * 60 * 60 * 1000).toISOString(),
            read: false,
            urgent: false
          },
          {
            id: Date.now() - 2000,
            type: 'yellow_card',
            title: '🟨 Gele kaart waarschuwing',
            message: 'Jesse heeft een gele kaart ontvangen voor te laat afmelden van de training op vrijdag. Let hier in de toekomst op.',
            sender: 'Systeem',
            senderRole: 'Automatisch',
            timestamp: new Date(Date.now() - 1 * 24 * 60 * 60 * 1000).toISOString(),
            read: false,
            urgent: true
          },
          {
            id: Date.now() - 3000,
            type: 'direct_message',
            title: '📧 Bericht van trainer',
            message: 'Hallo, volgende week hebben we een extra training op donderdag. Graag bevestigen of Jesse kan komen.',
            sender: 'Marco van der Berg',
            senderRole: 'Trainer O10-1',
            timestamp: new Date(Date.now() - 3 * 24 * 60 * 60 * 1000).toISOString(),
            read: true,
            urgent: false
          }
        ];
        localStorage.setItem(personalKey, JSON.stringify(demoPersonalMessages));
      }

      if (!localStorage.getItem('generalMessages')) {
        const demoGeneralMessages = [
          {
            id: Date.now() - 4000,
            title: '🏖️ Zomervakantie planning',
            message: 'Alle trainingen zijn gestopt van 15 juli t/m 15 augustus. We starten weer op maandag 18 augustus met een leuke hervatting-training!',
            sender: 'HJO Bestuur',
            senderRole: 'Bestuur',
            timestamp: new Date(Date.now() - 3 * 60 * 60 * 1000).toISOString(),
            read: false,
            urgent: false
          },
          {
            id: Date.now() - 5000,
            title: '🎉 Clubfeest 15 juni',
            message: 'Kom allemaal naar ons jaarlijkse clubfeest! BBQ, spelletjes en prijzen. Aanmelden via de website. Kosten: €15 voor volwassenen, €8 voor kinderen.',
            sender: 'Evenementen Commissie',
            senderRole: 'Evenementen',
            timestamp: new Date(Date.now() - 2 * 24 * 60 * 60 * 1000).toISOString(),
            read: true,
            urgent: false
          }
        ];
        localStorage.setItem('generalMessages', JSON.stringify(demoGeneralMessages));
      }
    }

    function switchTab(type) {
      currentTab = type;

      // Update tab visual states
      document.querySelectorAll('.message-tab').forEach(tab => {
        tab.classList.remove('active');
        if (tab.dataset.type === type) {
          tab.classList.add('active');
        }
      });

      loadMessages();
    }

    function loadMessages() {
      const container = document.getElementById('messagesContainer');
      let messages = [];

      if (currentTab === 'personal') {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        const userEmail = currentUser.email || 'ouder@test.nl';
        messages = JSON.parse(localStorage.getItem(`parent_notifications_${userEmail}`) || '[]');
      } else {
        messages = JSON.parse(localStorage.getItem('generalMessages') || '[]');
      }

      // Filter messages if needed
      if (showOnlyUnread) {
        messages = messages.filter(msg => !msg.read);
      }

      // Sort by timestamp (newest first)
      messages.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

      if (messages.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <i class="fas fa-inbox"></i>
            <h3>Geen berichten</h3>
            <p>${showOnlyUnread ? 'Alle berichten zijn gelezen' : 'Er zijn nog geen berichten'}</p>
          </div>
        `;
        return;
      }

      container.innerHTML = messages.map(msg => createMessageHTML(msg)).join('');
    }

    function createMessageHTML(message) {
      const isUrgent = message.urgent ? 'urgent' : '';
      const isUnread = !message.read ? 'unread' : '';
      const timeAgo = getTimeAgo(message.timestamp);

      return `
        <div class="message-item ${isUrgent} ${isUnread}" data-id="${message.id}">
          <div class="message-header">
            <div>
              <h3 class="message-title">${message.title}</h3>
              <div class="message-meta">
                <span><i class="fas fa-user"></i> ${message.sender}</span>
                <span><i class="fas fa-clock"></i> ${timeAgo}</span>
                ${!message.read ? '<span style="color: #1e40af; font-weight: 600;"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> Nieuw</span>' : ''}
              </div>
            </div>
            ${message.urgent ? '<div style="color: #ef4444; font-size: 1.2rem;" title="Urgent"><i class="fas fa-exclamation-triangle"></i></div>' : ''}
          </div>

          <div class="message-content">
            ${message.message}
          </div>

          <div class="message-actions">
            ${!message.read ? `<button class="message-btn primary" onclick="markAsRead(${message.id})"><i class="fas fa-check"></i> Markeer gelezen</button>` : ''}
            ${message.type === 'direct_message' ? `<button class="message-btn secondary" onclick="replyToMessage(${message.id})"><i class="fas fa-reply"></i> Beantwoorden</button>` : ''}
          </div>
        </div>
      `;
    }

    function getTimeAgo(timestamp) {
      const now = new Date();
      const time = new Date(timestamp);
      const diffInMinutes = Math.floor((now - time) / (1000 * 60));

      if (diffInMinutes < 1) return 'Net nu';
      if (diffInMinutes < 60) return `${diffInMinutes} min geleden`;

      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `${diffInHours} uur geleden`;

      const diffInDays = Math.floor(diffInHours / 24);
      if (diffInDays < 7) return `${diffInDays} dag${diffInDays > 1 ? 'en' : ''} geleden`;

      return time.toLocaleDateString('nl-NL');
    }

    function markAsRead(messageId) {
      if (currentTab === 'personal') {
        const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
        const userEmail = currentUser.email || 'ouder@test.nl';
        const messages = JSON.parse(localStorage.getItem(`parent_notifications_${userEmail}`) || '[]');

        const messageIndex = messages.findIndex(msg => msg.id === messageId);
        if (messageIndex !== -1) {
          messages[messageIndex].read = true;
          localStorage.setItem(`parent_notifications_${userEmail}`, JSON.stringify(messages));
        }
      } else {
        const messages = JSON.parse(localStorage.getItem('generalMessages') || '[]');
        const messageIndex = messages.findIndex(msg => msg.id === messageId);
        if (messageIndex !== -1) {
          messages[messageIndex].read = true;
          localStorage.setItem('generalMessages', JSON.stringify(messages));
        }
      }

      loadMessages();
      updateBadges();
      showNotification('Bericht gemarkeerd als gelezen', 'success');
    }

    function markAllAsRead() {
      if (confirm('Alle berichten markeren als gelezen?')) {
        if (currentTab === 'personal') {
          const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
          const userEmail = currentUser.email || 'ouder@test.nl';
          const messages = JSON.parse(localStorage.getItem(`parent_notifications_${userEmail}`) || '[]');

          messages.forEach(msg => msg.read = true);
          localStorage.setItem(`parent_notifications_${userEmail}`, JSON.stringify(messages));
        } else {
          const messages = JSON.parse(localStorage.getItem('generalMessages') || '[]');
          messages.forEach(msg => msg.read = true);
          localStorage.setItem('generalMessages', JSON.stringify(messages));
        }

        loadMessages();
        updateBadges();
        showNotification('Alle berichten gemarkeerd als gelezen', 'success');
      }
    }

    function toggleFilter(type) {
      const btn = document.getElementById('filterUnread');

      if (type === 'unread') {
        showOnlyUnread = !showOnlyUnread;
        btn.classList.toggle('active', showOnlyUnread);
      }

      loadMessages();
    }

    function refreshMessages() {
      loadMessages();
      updateBadges();
      showNotification('Berichten vernieuwd', 'info');
    }

    function updateBadges() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      const userEmail = currentUser.email || 'ouder@test.nl';
      const personalMessages = JSON.parse(localStorage.getItem(`parent_notifications_${userEmail}`) || '[]');
      const generalMessages = JSON.parse(localStorage.getItem('generalMessages') || '[]');

      const unreadPersonal = personalMessages.filter(msg => !msg.read).length;
      const unreadGeneral = generalMessages.filter(msg => !msg.read).length;

      const personalBadge = document.getElementById('personalBadge');
      const generalBadge = document.getElementById('generalBadge');

      if (personalBadge) {
        personalBadge.textContent = unreadPersonal;
        personalBadge.style.display = unreadPersonal > 0 ? 'flex' : 'none';
      }

      if (generalBadge) {
        generalBadge.textContent = unreadGeneral;
        generalBadge.style.display = unreadGeneral > 0 ? 'flex' : 'none';
      }
    }

    function replyToMessage(messageId) {
      showNotification('Antwoord functie wordt binnenkort toegevoegd', 'info');
    }

    function showNotification(message, type = 'info') {
      if (typeof NotificationManager !== 'undefined') {
        NotificationManager.show(message, type);
      } else {
        alert(message);
      }
    }
  </script>
</body>
</html>
