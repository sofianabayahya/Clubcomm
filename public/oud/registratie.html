<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ClubComm - Ouder Registratie</title>
  <link rel="icon" type="image/png" href="../assets/favicon.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
  <header>
    <div class="header-content">
      <a href="index.html" class="back-link">
        <i class="fas fa-arrow-left"></i> Login
      </a>
      <h1 class="header-title">
        <i class="fas fa-user-plus"></i> Ouder Registratie
      </h1>
    </div>
  </header>

  <div class="container">
    <div class="section">
      <h2 style="text-align: center; margin-bottom: 2rem; color: #1e5ba8;">
        Welkom bij SC Buitenveldert!
      </h2>
      <p style="text-align: center; color: #64748b; margin-bottom: 2rem;">
        Registreer jezelf als ouder om toegang te krijgen tot de ClubComm app
      </p>

      <!-- QR Code -->
      <div style="background: #f8fafc; padding: 2rem; border-radius: 12px; margin-bottom: 2rem;">
        <div style="width: 200px; height: 200px; background: white; border: 2px solid #e1e5e9; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto;">
          <div id="qrcode" style="padding: 10px;"></div>
        </div>
        <div style="text-align: center; margin-top: 1rem; color: #64748b;">
          <small>Scan deze QR code om direct te registreren</small>
        </div>
      </div>

      <form id="registrationForm">
        <!-- Ouder gegevens -->
        <div style="background: #f8fafc; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
          <h3 style="color: #1e5ba8; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-user"></i> Jouw gegevens
          </h3>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label class="form-label">Voornaam *</label>
              <input type="text" class="form-input" id="parentFirstName" required>
            </div>
            <div class="form-group">
              <label class="form-label">Achternaam *</label>
              <input type="text" class="form-input" id="parentLastName" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">E-mail adres *</label>
            <input type="email" class="form-input" id="parentEmail" required>
          </div>

          <div class="form-group">
            <label class="form-label">Telefoonnummer *</label>
            <input type="tel" class="form-input" id="parentPhone" required>
          </div>

          <div class="form-group">
            <label class="form-label">Wachtwoord *</label>
            <input type="password" class="form-input" id="parentPassword" required>
          </div>
        </div>

        <!-- Kind gegevens -->
        <div style="background: #f0f7ff; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
          <h3 style="color: #1e5ba8; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-child"></i> Kind gegevens
          </h3>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1rem;">
            <div class="form-group">
              <label class="form-label">Voornaam kind *</label>
              <input type="text" class="form-input" id="childFirstName" required>
            </div>
            <div class="form-group">
              <label class="form-label">Achternaam kind *</label>
              <input type="text" class="form-input" id="childLastName" required>
            </div>
          </div>

          <div class="form-group">
            <label class="form-label">Geboortedatum *</label>
            <input type="date" class="form-input" id="childBirthDate" required>
          </div>

          <div class="form-group">
            <label class="form-label">KNVB Bondsnummer (optioneel)</label>
            <input type="text" class="form-input" id="childKnvbNumber" placeholder="Bijv. 123456789">
            <small style="color: #64748b; font-size: 0.8rem;">
              Als je dit niet weet, kun je het later invullen
            </small>
          </div>
        </div>

        <!-- Contact voorkeuren -->
        <div style="background: #f0fdf4; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
          <h3 style="color: #1e5ba8; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-bell"></i> Notificatie voorkeuren
          </h3>

          <div style="display: flex; flex-direction: column; gap: 0.75rem;">
            <label class="checkbox-label">
              <input type="checkbox" id="emailNotifications" checked>
              <span class="checkmark"></span>
              E-mail notificaties ontvangen
            </label>

            <label class="checkbox-label">
              <input type="checkbox" id="smsNotifications" checked>
              <span class="checkmark"></span>
              SMS notificaties voor urgente berichten
            </label>

            <label class="checkbox-label">
              <input type="checkbox" id="transportNotifications" checked>
              <span class="checkmark"></span>
              Notificaties voor vervoer aanbiedingen
            </label>
          </div>
        </div>

        <!-- Privacyverklaring -->
        <div style="background: #fef3c7; padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem;">
          <h3 style="color: #92400e; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem;">
            <i class="fas fa-shield-alt"></i> Privacy & Voorwaarden
          </h3>

          <label class="checkbox-label">
            <input type="checkbox" id="privacyAgreement" required>
            <span class="checkmark"></span>
            Ik ga akkoord met de <a href="#" style="color: #1e5ba8;">privacyverklaring</a> en <a href="#" style="color: #1e5ba8;">gebruiksvoorwaarden</a> *
          </label>
        </div>

        <button type="submit" class="btn" style="width: 100%; font-size: 1.1rem; padding: 1rem;">
          <i class="fas fa-user-plus"></i> Account Aanmaken
        </button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="api-client.js"></script>
  <script>
    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      // Show loading state
      const submitBtn = this.querySelector('button[type="submit"]');
      const originalText = submitBtn.innerHTML;
      submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Registreren...';
      submitBtn.disabled = true;

      try {
        // Collect form data
        const formData = {
          parent: {
            firstName: document.getElementById('parentFirstName').value,
            lastName: document.getElementById('parentLastName').value,
            email: document.getElementById('parentEmail').value,
            phone: document.getElementById('parentPhone').value,
            password: document.getElementById('parentPassword').value
          },
          child: {
            firstName: document.getElementById('childFirstName').value,
            lastName: document.getElementById('childLastName').value,
            birthDate: document.getElementById('childBirthDate').value,
            knvbNumber: document.getElementById('childKnvbNumber').value
          },
          notifications: {
            email: document.getElementById('emailNotifications').checked,
            sms: document.getElementById('smsNotifications').checked,
            transport: document.getElementById('transportNotifications').checked
          }
        };

        // Send to backend API
        const response = await clubAPI.register(formData);

        if (response.success) {
          // Store some data locally for demo purposes (fallback)
          localStorage.setItem('currentPlayerName', `${formData.child.firstName} ${formData.child.lastName}`);
          
          // Show success message
          showSuccessMessage(formData.parent.email);
        }

      } catch (error) {
        console.error('Registration error:', error);
        
        // Fallback to localStorage for demo if backend not available
        const existingRegistrations = JSON.parse(localStorage.getItem('parentRegistrations') || '[]');
        existingRegistrations.push({
          ...formData,
          registrationDate: new Date().toISOString()
        });
        localStorage.setItem('parentRegistrations', JSON.stringify(existingRegistrations));
        
        showSuccessMessage(formData.parent.email);
        
      } finally {
        // Reset button
        submitBtn.innerHTML = originalText;
        submitBtn.disabled = false;
      }
    });

    function generateSecurePassword() {
      const length = 12;
      const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%&*";
      let password = "";
      
      // Ensure at least one of each type
      password += charset.charAt(Math.floor(Math.random() * 26)); // lowercase
      password += charset.charAt(Math.floor(Math.random() * 26) + 26); // uppercase
      password += charset.charAt(Math.floor(Math.random() * 10) + 52); // number
      password += charset.charAt(Math.floor(Math.random() * 7) + 62); // special char
      
      // Fill remaining length
      for (let i = 4; i < length; i++) {
        password += charset.charAt(Math.floor(Math.random() * charset.length));
      }
      
      // Shuffle the password
      return password.split('').sort(() => Math.random() - 0.5).join('');
    }

    function showSuccessPopup(email) {
      // Create overlay
      const overlay = document.createElement('div');
      overlay.style.cssText = `
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0, 0, 0, 0.8);
        z-index: 10000;
        display: flex;
        align-items: center;
        justify-content: center;
        animation: fadeIn 0.3s ease;
      `;

      // Create popup
      const popup = document.createElement('div');
      popup.style.cssText = `
        background: white;
        padding: 3rem;
        border-radius: 20px;
        text-align: center;
        max-width: 90%;
        width: 400px;
        box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3);
        animation: slideInUp 0.4s ease;
      `;

      popup.innerHTML = `
        <div style="font-size: 4rem; margin-bottom: 1.5rem;">🎉</div>
        <h2 style="color: #22c55e; margin-bottom: 1rem; font-size: 1.5rem;">
          Registratie Succesvol!
        </h2>
        <div style="background: #f0f9ff; padding: 1.5rem; border-radius: 12px; margin: 1.5rem 0;">
          <p style="color: #1e40af; margin-bottom: 1rem; font-weight: 600;">
            <i class="fas fa-envelope"></i> Wat gebeurt er nu?
          </p>
          <div style="text-align: left; color: #64748b; font-size: 0.9rem; line-height: 1.6;">
            <div style="margin-bottom: 0.5rem;">✅ HJO ontvangt automatisch een melding</div>
            <div style="margin-bottom: 0.5rem;">📧 Je krijgt binnen 24u een email met logingegevens</div>
            <div style="margin-bottom: 0.5rem;">🔐 Beveiligde wachtwoord wordt automatisch gegenereerd</div>
            <div>👨‍👩‍👧‍👦 Je kind wordt toegewezen aan het juiste team</div>
          </div>
        </div>
        <p style="color: #64748b; margin-bottom: 2rem;">
          Bevestiging wordt verzonden naar:<br>
          <strong style="color: #1e5ba8;">${email}</strong>
        </p>
        <button onclick="window.location.href='index.html'" style="
          background: linear-gradient(135deg, #1e5ba8, #164a91);
          color: white;
          border: none;
          padding: 1rem 2rem;
          border-radius: 12px;
          font-weight: 600;
          cursor: pointer;
          width: 100%;
          font-size: 1rem;
        ">
          <i class="fas fa-sign-in-alt"></i> Naar Login
        </button>
      `;

      overlay.appendChild(popup);
      document.body.appendChild(overlay);

      // Add CSS animations
      const style = document.createElement('style');
      style.textContent = `
        @keyframes fadeIn {
          from { opacity: 0; }
          to { opacity: 1; }
        }
        @keyframes slideInUp {
          from { transform: translateY(30px); opacity: 0; }
          to { transform: translateY(0); opacity: 1; }
        }
      `;
      document.head.appendChild(style);

      // Auto close after 10 seconds
      setTimeout(() => {
        if (overlay.parentElement) {
          window.location.href = 'index.html';
        }
      }, 10000);
    }

    function showSuccessMessage() {
      const email = document.getElementById('parentEmail').value;
      
      // Store success message for login page
      localStorage.setItem('registrationSuccess', JSON.stringify({
        email: email,
        timestamp: new Date().toISOString(),
        message: 'Registratie succesvol! De HJO beoordeelt uw aanmelding en u ontvangt binnen 24 uur uw logingegevens per email.'
      }));
      
      // Show success popup
      showSuccessPopup(email);
      
      // Send HJO notification and email
      sendHJONotification(email);
      sendConfirmationEmail(email);
    }

    function sendHJONotification(parentEmail) {
      // Create HJO notification
      const hjoNotifications = JSON.parse(localStorage.getItem('hjoNotifications') || '[]');
      
      const notification = {
        id: Date.now(),
        type: 'new_registration',
        message: `Nieuwe ouder registratie: ${parentEmail}`,
        parentEmail: parentEmail,
        timestamp: new Date().toISOString(),
        read: false,
        priority: 'normal',
        action_required: true
      };

      hjoNotifications.unshift(notification);
      localStorage.setItem('hjoNotifications', JSON.stringify(hjoNotifications));

      // Simulate email to HJO
      console.log('📧 Email verzonden naar HJO:', {
        to: 'hjo@buitenveldert.nl',
        subject: 'Nieuwe ouder registratie - Actie vereist',
        body: `Een nieuwe ouder heeft zich geregistreerd en wacht op goedkeuring.\n\nEmail: ${parentEmail}\n\nLog in op het HJO dashboard om de registratie te beoordelen.`
      });
    }

    function sendConfirmationEmail(parentEmail) {
      // Generate secure password
      const generatedPassword = generateSecurePassword();
      
      // Store pending account (will be activated when HJO approves)
      const pendingAccounts = JSON.parse(localStorage.getItem('pendingAccounts') || '[]');
      pendingAccounts.push({
        email: parentEmail,
        password: generatedPassword,
        createdAt: new Date().toISOString(),
        status: 'pending_approval'
      });
      localStorage.setItem('pendingAccounts', JSON.stringify(pendingAccounts));

      // Simulate confirmation email
      console.log('📧 Bevestigingsmail voorbereid voor:', {
        to: parentEmail,
        subject: 'ClubComm - Registratie ontvangen',
        body: `Beste ouder,\n\nUw registratie is succesvol ontvangen. De HJO zal uw aanmelding beoordelen en u binnen 24 uur toegang geven.\n\nUw logingegevens worden dan per email verzonden.\n\nMet vriendelijke groet,\nSC Buitenveldert`
      });
    }

    // Generate QR code
    const qrcode = new QRCode(document.getElementById("qrcode"), {
      text: window.location.href, // Use current page URL
      width: 180,
      height: 180,
      colorDark : "#000",
      colorLight : "#fff",
      correctLevel : QRCode.CorrectLevel.H
    });
  </script>

  <style>
    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      cursor: pointer;
      color: #334155;
      font-weight: 500;
    }

    .checkbox-label input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #1e5ba8;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    .form-label {
      display: block;
      font-weight: 500;
      color: #374151;
      margin-bottom: 0.5rem;
    }

    @media (max-width: 768px) {
      .container {
        padding: 0 0.5rem;
      }

      div[style*="grid-template-columns: 1fr 1fr"] {
        grid-template-columns: 1fr !important;
      }
    }
  </style>
</body>
</html>
