<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0869c2">
  <title>Evaluatie coach · ClubComm</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- ClubComm — evaluatieformulier praktijkbegeleiding coach (Besluit 93). Losse pagina, geen login.
       Alles blijft op dit toestel (localStorage); de PDF (printen) is het bewaarexemplaar. -->
  <style>
    :root { --blauw: #0869c2; --inkt: #0b2545; --zacht: #5b6b7f; --lijn: #dde3ea; --vlak: #fff; --achter: #f4f6f9; --groen: #1b7f4b; --oranje: #b45309; --r: 14px; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; background: var(--achter); color: var(--inkt); font-size: 16px; line-height: 1.45; }
    header.kop { background: var(--blauw); color: #fff; padding: 14px 16px; position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 10px; }
    header.kop img { width: 32px; height: 32px; border-radius: 8px; background: #fff; }
    header.kop b { font-size: 17px; display: block; }
    header.kop small { opacity: .85; }
    main { max-width: 760px; margin: 0 auto; padding: 14px 16px 120px; }
    section.blok { background: var(--vlak); border-radius: var(--r); box-shadow: 0 1px 3px rgba(11,37,69,.08); padding: 14px 16px; margin: 12px 0; }
    h2 { font-size: 17px; margin: 0 0 4px; }
    h3 { font-size: 15px; margin: 14px 0 2px; }
    .hulp { color: var(--zacht); font-size: 14px; margin: 0 0 8px; }
    label { display: block; font-size: 13px; font-weight: 600; color: var(--zacht); margin: 10px 0 4px; }
    input, textarea, select { width: 100%; font: inherit; color: inherit; border: 1px solid var(--lijn); border-radius: 10px; padding: 10px 12px; background: #fff; }
    textarea { min-height: 84px; resize: vertical; }
    input:focus, textarea:focus { outline: 3px solid rgba(8,105,194,.25); border-color: var(--blauw); }
    .twee { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
    .knop { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border: 0; border-radius: 12px; padding: 11px 16px; font: inherit; font-weight: 600; background: var(--blauw); color: #fff; cursor: pointer; }
    .knop.licht { background: #e8f1fb; color: var(--blauw); }
    .knop.klein { padding: 7px 12px; font-size: 14px; }
    .knop.rood { background: #fde8e8; color: #b42318; }
    .knoppen { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .fasen { display: flex; gap: 6px; margin: 8px 0; }
    .fasen button { flex: 1; border: 1px solid var(--lijn); background: #fff; border-radius: 10px; padding: 8px 4px; font: inherit; font-size: 13px; font-weight: 600; color: var(--inkt); cursor: pointer; }
    .fasen button.aan { background: var(--blauw); border-color: var(--blauw); color: #fff; }
    .labels { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
    .labels button { border: 1px solid var(--lijn); background: #fff; border-radius: 999px; padding: 5px 10px; font: inherit; font-size: 13px; color: var(--inkt); cursor: pointer; }
    .labels button.aan { background: #e8f1fb; border-color: var(--blauw); color: var(--blauw); font-weight: 600; }
    .noteer { display: grid; gap: 8px; }
    .noteer .kopregel { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .noteer .kopregel input { width: 76px; flex: none; }
    .noteer .labels { margin: 0; }
    .noteer textarea { min-height: 56px; }
    .telling { font-size: 13px; color: var(--zacht); margin: 8px 0 0; }
    .telling b { color: var(--inkt); }
    ul.notities { list-style: none; padding: 0; margin: 10px 0 0; }
    ul.notities li { border-top: 1px solid var(--lijn); padding: 8px 0; display: flex; gap: 8px; align-items: flex-start; font-size: 15px; }
    ul.notities li .tijd { color: var(--zacht); font-size: 13px; min-width: 44px; padding-top: 1px; }
    ul.notities li .tekst { flex: 1; }
    ul.notities li .spelers { display: block; color: var(--zacht); font-size: 14px; margin-top: 2px; }
    ul.notities li .tag { display: inline-block; font-size: 11px; background: #e8f1fb; color: var(--blauw); border-radius: 999px; padding: 1px 7px; margin-left: 4px; }
    ul.notities li button { border: 0; background: none; color: var(--zacht); font-size: 18px; cursor: pointer; padding: 0 4px; }
    .leeg { color: var(--zacht); font-size: 14px; margin: 8px 0 0; }
    .afspraak { background: #f0f6fd; border-radius: 10px; padding: 8px 12px; font-size: 14px; margin: 6px 0 4px; }
    .ref { background: #f7f8fa; border-left: 3px solid var(--lijn); padding: 6px 10px; font-size: 13px; color: var(--zacht); margin: 0 0 8px; border-radius: 0 8px 8px 0; }
    .ref b { color: var(--inkt); }
    .stap { display: grid; grid-template-columns: 28px 1fr; gap: 8px; margin-top: 16px; }
    .stap .nr { width: 28px; height: 28px; border-radius: 50%; background: var(--blauw); color: #fff; display: grid; place-items: center; font-weight: 700; font-size: 14px; }
    .stap h3 { margin: 3px 0 2px; }
    .punt { border: 2px solid var(--blauw); border-radius: 12px; padding: 10px 12px; margin-top: 12px; background: #f0f6fd; }
    .punt label { color: var(--blauw); margin-top: 0; }
    .schaal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .schaal button { border: 1px solid var(--lijn); background: #fff; border-radius: 10px; padding: 9px 4px; font: inherit; font-size: 13px; cursor: pointer; color: var(--inkt); }
    .schaal button.aan { background: var(--blauw); border-color: var(--blauw); color: #fff; font-weight: 600; }
    .melding { font-size: 13px; color: var(--zacht); text-align: center; margin: 14px 0 0; }
    .voet { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(255,255,255,.96); border-top: 1px solid var(--lijn); padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); display: flex; gap: 8px; justify-content: center; z-index: 5; }
    .voet .knop { flex: 1; max-width: 260px; }
    .fout { color: #b42318; font-size: 14px; margin-top: 6px; }
    .lijst-eerder button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--lijn); background: none; padding: 10px 0; font: inherit; color: var(--inkt); cursor: pointer; }
    .lijst-eerder button small { display: block; color: var(--zacht); }
    #afdruk { display: none; }
    @media (max-width: 420px) { .twee { grid-template-columns: 1fr; } }

    /* Afdruk / PDF: één nette A4, zonder knoppen en invulvelden */
    @media print {
      @page { size: A4; margin: 16mm 15mm; }
      body { background: #fff; font-size: 11pt; }
      header.kop, main, .voet { display: none !important; }
      #afdruk { display: block; color: #000; }
      #afdruk h1 { font-size: 17pt; margin: 0 0 2pt; color: var(--blauw); }
      #afdruk .sub { color: #444; margin: 0 0 10pt; }
      #afdruk table.gegevens { border-collapse: collapse; width: 100%; margin-bottom: 8pt; font-size: 10pt; }
      #afdruk table.gegevens td { padding: 2pt 6pt 2pt 0; vertical-align: top; }
      #afdruk table.gegevens td:first-child { color: #555; width: 34%; }
      #afdruk h2 { font-size: 12.5pt; margin: 12pt 0 4pt; color: var(--blauw); border-bottom: 1px solid #ccd; padding-bottom: 2pt; }
      #afdruk h2, #afdruk h3 { break-after: avoid; }
      #afdruk h3 { font-size: 11pt; margin: 8pt 0 2pt; }
      #afdruk p { margin: 0 0 4pt; white-space: pre-wrap; }
      #afdruk .vraag { color: #555; font-size: 9.5pt; margin: 0 0 2pt; }
      #afdruk .regels { border-bottom: 1px solid #bbb; height: 16pt; }
      #afdruk .kader { border: 1.5pt solid var(--blauw); padding: 6pt 8pt; margin-top: 6pt; }
      #afdruk ul { margin: 0 0 4pt; padding-left: 14pt; }
      #afdruk li { margin: 0 0 2pt; }
      #afdruk .p-blok, #afdruk .kader { break-inside: avoid; }
      #afdruk table.obs { border-collapse: collapse; width: 100%; font-size: 9.5pt; margin: 2pt 0 6pt; }
      #afdruk table.obs th, #afdruk table.obs td { border: 1px solid #ccd; padding: 2pt 4pt; text-align: left; vertical-align: top; }
      #afdruk table.obs th { background: #f0f4fa; }
      #afdruk .voetregel { color: #777; font-size: 8.5pt; margin-top: 14pt; }
      #afdruk table.obs.leeg td { height: 30pt; }
      #afdruk table.obs.leeg.kort td { height: 26pt; }
      #afdruk table.obs .soort { font-size: 8pt; color: #555; white-space: nowrap; letter-spacing: 1pt; }
      #afdruk .nieuwe-pagina { break-before: page; }
      #afdruk table.turf { border-collapse: collapse; width: 100%; font-size: 9.5pt; margin: 2pt 0 6pt; }
      #afdruk table.turf th, #afdruk table.turf td { border: 1px solid #ccd; padding: 3pt 4pt; text-align: left; height: 18pt; }
      #afdruk table.turf th { background: #f0f4fa; }
    }
  </style>
</head>
<body>
  <header class="kop"><img src="assets/clubcomm-icon.png" alt=""><div><b>Evaluatie coach</b><small>Praktijkbegeleiding</small></div></header>
  <main id="formulier"></main>
  <div class="voet"><button class="knop licht" type="button" data-act="eerder">Eerdere</button><button class="knop" type="button" data-act="pdf">PDF / printen</button></div>
  <div id="afdruk"></div>

<script>
(function () {
  'use strict';
  const OPSLAG = 'clubcomm-evaluaties-v1';
  const FASEN = [['h1', '1e helft · laatste 20 min'], ['rust', 'Rust · kleedkamer'], ['h2', '2e helft · eerste 20 min']];
  // Alleen objectieve soorten coachgedrag (wat hij zegt of doet); het oordeel ("te snel", "bewust stil") hoort in het gesprek
  const SOORTEN = ['Vraag', 'Directief', 'Correctie', 'Compliment'];
  // Volgorde van het gesprek (8-10): eerst het gevoel, dan het leerdoel (staat erboven, niet nog eens vragen)
  const STAPPEN = [
    { k: 's1', t: 'Eerste gevoel', v: 'Hoe kijk je terug op je eigen coachen vandaag? Wat is je eerste gevoel?' },
    { k: 's2', t: 'Leerdoel', v: 'In hoeverre is het gelukt? Wanneer wel, wanneer niet? Wat veranderde er na de rust?', toon: 'leerdoel', telling: true },
    { k: 's3', t: 'Effect op spelers', v: 'Wat deden de spelers wanneer jij een vraag stelde, directief coachte of corrigeerde?', spelers: true },
    { k: 's4', t: 'Voetbalinhoud', v: 'Zagen we het gewenste spelersgedrag terug? Wat zagen we bij het waarnemen, begrijpen en kiezen van spelers?', toon: 'voetbal' },
    { k: 's5', t: 'Feedback HO', v: 'Wat heb ik gezien in jouw coachgedrag? Welke momenten bevestigen jouw analyse, en waar zag ik iets anders?', alle: true, telling: true },
    { k: 's6', t: 'Volgende stap', v: 'Wat ga je de volgende training of wedstrijd bewust doen?' },
  ];
  const REFLECTIE = [
    ['r1', 'Wat heb ik geleerd over mijn eigen coachgedrag?'],
    ['r2', 'Welk effect had mijn handelen op de spelers?'],
    ['r3', 'In welke situatie ga ik mijn ontwikkelpunt de volgende keer toepassen?'],
  ];
  const SCHAAL = ['nog niet', 'soms', 'meestal', 'bewust en vaak'];

  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const vandaag = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const nuTijd = () => { const d = new Date(); return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`; };
  const datumLang = (s) => { if (!s) return ''; const d = new Date(`${s}T12:00:00`); return d.toLocaleDateString('nl-NL', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' }); };

  // Opslag: alleen op dit toestel. Kan in een privévenster mislukken; dan werkt de pagina gewoon, maar onthoudt niets.
  const lees = () => { try { return JSON.parse(localStorage.getItem(OPSLAG)) || { lijst: [], huidig: null }; } catch (e) { return { lijst: [], huidig: null }; } };
  let st = lees();
  const bewaar = () => { try { localStorage.setItem(OPSLAG, JSON.stringify(st)); } catch (e) { /* niet bewaard */ } };
  const nieuw = (vorige) => ({ id: 'e' + Date.now(), gemaakt: new Date().toISOString(), coach: vorige ? vorige.coach : '', team: vorige ? vorige.team : '', ho: vorige ? vorige.ho : '', bijeenkomst: vorige && Number(vorige.bijeenkomst) ? String(Number(vorige.bijeenkomst) + 1) : '3',
    datum: vandaag(), tegenstander: '', leerdoel: '', voetbalprobleem: '', signalen: '', focus: '', begeleiding: '', feedbackmoment: '', notities: [], s1: '', s2: '', s3: '', s4: '', s5: '', s6: '', punt: '', schaal: '', r1: '', r2: '', r3: '', r4: '', vorigPunt: vorige ? vorige.punt : '' });
  const huidig = () => { let e = st.lijst.find((x) => x.id === st.huidig); if (!e) { e = nieuw(st.lijst[st.lijst.length - 1]); st.lijst.push(e); st.huidig = e.id; bewaar(); } return e; };
  let fase = 'h1'; let gekozenSoort = '';

  const veld = (k, label, opts = {}) => { const e = huidig(); const id = 'v-' + k;
    return `<label for="${id}">${label}</label>${opts.lang ? `<textarea id="${id}" data-veld="${k}" placeholder="${esc(opts.ph || '')}">${esc(e[k])}</textarea>` : `<input id="${id}" data-veld="${k}" type="${opts.type || 'text'}" value="${esc(e[k])}" placeholder="${esc(opts.ph || '')}">`}`; };

  // Een moment: minuut · soort · wat de coach zegt of doet · wat de spelers daarna doen (oudere notities: tijd + tekst)
  const coachTekst = (x) => x.coach != null ? x.coach : x.tekst;
  const minTekst = (x) => (x.min ? `${x.min}'` : x.coach == null ? x.tijd || '' : ''); // rust: geen minuut
  const notitieLijst = (filter) => { const e = huidig();
    return e.notities.filter(filter).map((x) => `<li><span class="tijd">${esc(minTekst(x))}</span><span class="tekst">${x.soort ? `<span class="tag">${esc(x.soort)}</span> ` : ''}${esc(coachTekst(x))}${x.spelers ? `<span class="spelers">→ ${esc(x.spelers)}</span>` : ''}</span><button type="button" data-act="weg" data-id="${x.id}" aria-label="Moment weghalen">×</button></li>`).join(''); };
  const telling = (lijst) => SOORTEN.map((w) => [w, lijst.filter((x) => x.soort === w).length]).filter(([, n]) => n).map(([w, n]) => `${w} ${n}`).join(' · ');
  const tellingPerDeel = (e) => FASEN.map(([k, l]) => { const t = telling(e.notities.filter((x) => x.fase === k)); return t ? `<b>${l.split(' · ')[0]}:</b> ${t}` : ''; }).filter(Boolean).join('<br>');

  const render = () => {
    const e = huidig();
    const inFase = e.notities.filter((x) => x.fase === fase);
    document.getElementById('formulier').innerHTML = `
      ${e.vorigPunt ? `<section class="blok"><h2>Vorige afspraak</h2><p class="hulp">Begin het gesprek met de vraag of dit gelukt is.</p><div class="afspraak">${esc(e.vorigPunt)}</div></section>` : ''}
      <section class="blok"><h2>Gegevens</h2>
        <div class="twee"><div>${veld('coach', 'Naam coach')}</div><div>${veld('team', 'Team')}</div></div>
        <div class="twee"><div>${veld('datum', 'Datum', { type: 'date' })}</div><div>${veld('tegenstander', 'Tegenstander')}</div></div>
        <div class="twee"><div>${veld('bijeenkomst', 'Bijeenkomst', { type: 'number' })}</div><div>${veld('ho', 'HO (praktijkbegeleider)')}</div></div>
      </section>
      <section class="blok"><h2>Afspraak uit het voorgesprek</h2><p class="hulp">Het leerdoel en het voetbalprobleem staan straks bij de juiste stap van het gesprek.</p>
        ${veld('leerdoel', 'Persoonlijk leerdoel coach', { lang: true, ph: 'Wat wil de coach in deze wedstrijd oefenen in zijn eigen handelen?' })}
        ${veld('voetbalprobleem', 'Voetbalprobleem', { lang: true, ph: 'Welk concreet voetbalprobleem staat centraal?' })}
        ${veld('signalen', 'Gewenst spelersgedrag (2 à 3 signalen)', { lang: true, ph: 'Waaraan zie je dat het doel wordt bereikt?' })}
        ${veld('focus', 'Focus van de HO tijdens de observatie', { lang: true })}
        ${veld('feedbackmoment', 'Afgesproken feedbackmoment(en)', { ph: 'Bijv. kort in de rust, uitgebreid na afloop' })}
      </section>
      <section class="blok"><h2>Observatie</h2><p class="hulp">Noteer wat de coach zegt of doet (zo letterlijk mogelijk) en wat de spelers daarna doen. Geen oordeel; dat komt in het gesprek.</p>
        <div class="fasen" role="tablist">${FASEN.map(([k, l]) => `<button type="button" role="tab" class="${k === fase ? 'aan' : ''}" data-act="fase" data-k="${k}">${l} <span>(${e.notities.filter((x) => x.fase === k).length})</span></button>`).join('')}</div>
        <p class="hulp"><button class="knop licht klein" type="button" data-act="papier">Observatieformulier (papier)</button> Leeg formulier om te printen of als PDF te delen.</p>
        <form class="noteer" data-act="noteer">
          <div class="kopregel"><input id="n-min" type="number" inputmode="numeric" min="0" max="130" placeholder="Min." aria-label="Minuut"><div class="labels">${SOORTEN.map((w) => `<button type="button" class="${gekozenSoort === w ? 'aan' : ''}" data-act="soort" data-w="${w}">${w}</button>`).join('')}</div></div>
          <textarea id="n-coach" placeholder="Coach zegt of doet, bijv. &quot;Druk zetten, 6!&quot;" aria-label="Coach zegt of doet"></textarea>
          <input id="n-spelers" placeholder="Spelers doen daarna (mag leeg)" autocomplete="off" aria-label="Spelers doen daarna">
          <button class="knop" type="submit">Noteer</button></form>
        ${inFase.length ? `${telling(inFase) ? `<p class="telling"><b>Telling dit deel:</b> ${telling(inFase)}</p>` : ''}<ul class="notities">${notitieLijst((x) => x.fase === fase)}</ul>` : '<p class="leeg">Nog geen momenten in dit deel.</p>'}
      </section>
      <section class="blok"><h2>Evaluatiegesprek</h2><p class="hulp">Samen met de coach.</p>
        ${STAPPEN.map((s, i) => { const ref = s.spelers ? e.notities.filter((x) => x.spelers) : [];
          return `<div class="stap"><span class="nr">${i + 1}</span><div><h3>${s.t}</h3>
            ${s.toon === 'leerdoel' && e.leerdoel ? `<div class="afspraak"><b>Leerdoel:</b> ${esc(e.leerdoel)}</div>` : ''}
            ${s.toon === 'voetbal' && (e.voetbalprobleem || e.signalen) ? `<div class="afspraak">${e.voetbalprobleem ? `<b>Voetbalprobleem:</b> ${esc(e.voetbalprobleem)}` : ''}${e.voetbalprobleem && e.signalen ? '<br>' : ''}${e.signalen ? `<b>Gewenst spelersgedrag:</b> ${esc(e.signalen)}` : ''}</div>` : ''}
            <p class="hulp">${s.v}</p>
            ${s.telling && tellingPerDeel(e) ? `<div class="ref"><b>Telling coachgedrag</b><br>${tellingPerDeel(e)}</div>` : ''}
            ${ref.length ? `<div class="ref"><b>Wat de spelers deden:</b> ${ref.map((x) => `${esc(minTekst(x))} ${x.soort ? esc(x.soort.toLowerCase()) + ': ' : ''}${esc(coachTekst(x))} → ${esc(x.spelers)}`).join(' · ')}</div>` : ''}
            ${s.alle && e.notities.length ? `<div class="ref">Al je momenten (${e.notities.length}) staan bij Observatie en komen in de PDF.</div>` : ''}
            <textarea data-veld="${s.k}" aria-label="${s.t}">${esc(e[s.k])}</textarea>
            ${s.k === 's6' ? `<div class="punt"><label for="v-punt">Eén concreet ontwikkelpunt</label><input id="v-punt" data-veld="punt" value="${esc(e.punt)}" maxlength="160" placeholder="Eén zin. Niet vijf punten, één."><p class="hulp" style="margin:6px 0 0">Dit komt bij de volgende evaluatie bovenaan als "vorige afspraak".</p></div>` : ''}
          </div></div>`; }).join('')}
        <h3 style="margin-top:18px">Hoe zag jij het leerdoel terug? <small class="hulp">(mag leeg)</small></h3>
        <div class="schaal">${SCHAAL.map((w) => `<button type="button" class="${e.schaal === w ? 'aan' : ''}" data-act="schaal" data-w="${w}">${w}</button>`).join('')}</div>
        ${veld('begeleiding', 'Wat had je meer of anders van mij nodig? (feedback op de begeleiding, mag leeg)', { lang: true })}
      </section>
      <section class="blok"><h2>Reflectie trainer</h2><p class="hulp">Schrijft de coach zelf, kort. Mag ook later: lege vragen komen in de PDF met schrijflijnen.</p>
        ${REFLECTIE.map(([k, v]) => veld(k, v, { lang: true })).join('')}
      </section>
      <section class="blok"><h2>Deze evaluatie</h2>
        <div class="knoppen"><button class="knop licht" type="button" data-act="nieuwe">Nieuwe evaluatie</button><button class="knop rood klein" type="button" data-act="wissen">Deze evaluatie wissen</button></div>
      </section>`;
  };

  // Invoer: meteen bewaren (zonder alles opnieuw te tekenen, zodat je door kunt typen)
  document.addEventListener('input', (ev) => { const k = ev.target.dataset && ev.target.dataset.veld; if (!k) return; huidig()[k] = ev.target.value; bewaar(); });
  document.addEventListener('submit', (ev) => { ev.preventDefault(); if (ev.target.dataset.act !== 'noteer') return; const g = (id) => document.getElementById(id).value.trim();
    if (!g('n-coach')) { document.getElementById('n-coach').focus(); return; }
    huidig().notities.push({ id: 'n' + Date.now(), fase, min: g('n-min'), soort: gekozenSoort, coach: g('n-coach'), spelers: g('n-spelers'), tijd: nuTijd() }); gekozenSoort = ''; bewaar(); render(); const n = document.getElementById('n-min'); if (n) n.focus(); });
  document.addEventListener('click', (ev) => { const b = ev.target.closest('[data-act]'); if (!b || b.tagName === 'FORM') return; const a = b.dataset.act; const e = huidig();
    if (a === 'fase') { fase = b.dataset.k; render(); }
    else if (a === 'soort') { gekozenSoort = gekozenSoort === b.dataset.w ? '' : b.dataset.w; const w = ['n-min', 'n-coach', 'n-spelers'].map((id) => document.getElementById(id).value); render(); ['n-min', 'n-coach', 'n-spelers'].forEach((id, k) => { document.getElementById(id).value = w[k]; }); }
    else if (a === 'weg') { e.notities = e.notities.filter((x) => x.id !== b.dataset.id); bewaar(); render(); }
    else if (a === 'schaal') { e.schaal = e.schaal === b.dataset.w ? '' : b.dataset.w; bewaar(); render(); }
    else if (a === 'pdf') { if (!e.punt.trim()) { alert('Vul eerst bij stap 6 het ene concrete ontwikkelpunt in.'); const p = document.getElementById('v-punt'); if (p) { p.scrollIntoView({ block: 'center' }); p.focus(); } return; } maakAfdruk(); window.print(); }
    else if (a === 'nieuwe') { if (!confirm('Een nieuwe evaluatie beginnen? Deze blijft bewaard bij "Eerdere".')) return; const n = nieuw(e); st.lijst.push(n); st.huidig = n.id; fase = 'h1'; bewaar(); render(); window.scrollTo(0, 0); }
    else if (a === 'wissen') { if (!confirm('Deze evaluatie helemaal wissen? Dat kan niet ongedaan worden.')) return; st.lijst = st.lijst.filter((x) => x.id !== e.id); st.huidig = null; bewaar(); render(); window.scrollTo(0, 0); }
    else if (a === 'papier') { afdrukSoort = 'papier'; maakPapier(); window.print(); }
    else if (a === 'eerder') { toonEerder(); }
    else if (a === 'open') { st.huidig = b.dataset.id; bewaar(); render(); window.scrollTo(0, 0); }
  });

  const toonEerder = () => { const lijst = st.lijst.slice().reverse();
    document.getElementById('formulier').innerHTML = `<section class="blok"><h2>Eerdere evaluaties</h2><div class="lijst-eerder">${lijst.map((x) => `<button type="button" data-act="open" data-id="${x.id}"><b>${esc(x.coach || 'Coach')} · bijeenkomst ${esc(x.bijeenkomst || '?')}</b><small>${esc(datumLang(x.datum))}${x.tegenstander ? ' · tegen ' + esc(x.tegenstander) : ''}${x.punt ? ' · ' + esc(x.punt) : ''}</small></button>`).join('') || '<p class="leeg">Nog niets.</p>'}</div>
      <div class="knoppen"><button class="knop licht" type="button" data-act="open" data-id="${st.huidig}">Terug</button></div></section>`; window.scrollTo(0, 0); };

  // De afdruk (PDF): leesbare tekst, lege vragen met schrijflijnen
  const tekstOfLijnen = (s, n = 3) => (String(s || '').trim() ? `<p>${esc(s)}</p>` : Array.from({ length: n }, () => '<div class="regels"></div>').join(''));
  const maakAfdruk = () => { const e = huidig();
    const notities = (k) => e.notities.filter((x) => x.fase === k);
    document.getElementById('afdruk').innerHTML = `
      <h1>Evaluatie coach</h1><p class="sub">Praktijkbegeleiding${e.bijeenkomst ? ` · bijeenkomst ${esc(e.bijeenkomst)}` : ''}</p>
      <table class="gegevens"><tr><td>Coach</td><td>${esc(e.coach)}</td></tr><tr><td>Team</td><td>${esc(e.team)}</td></tr><tr><td>Datum</td><td>${esc(datumLang(e.datum))}</td></tr><tr><td>Tegenstander</td><td>${esc(e.tegenstander)}</td></tr><tr><td>HO</td><td>${esc(e.ho)}</td></tr></table>
      ${e.vorigPunt ? `<h2>Vorige afspraak</h2><p>${esc(e.vorigPunt)}</p>` : ''}
      <h2>Afspraak uit het voorgesprek</h2>
      <h3>Persoonlijk leerdoel coach</h3>${tekstOfLijnen(e.leerdoel, 2)}
      <h3>Voetbalprobleem</h3>${tekstOfLijnen(e.voetbalprobleem, 2)}
      <h3>Gewenst spelersgedrag</h3>${tekstOfLijnen(e.signalen, 2)}
      <h3>Focus van de HO</h3>${tekstOfLijnen(e.focus, 2)}
      <h3>Feedbackmoment(en)</h3>${tekstOfLijnen(e.feedbackmoment, 1)}
      ${e.notities.length ? `<h2>Observatie</h2>${FASEN.map(([k, l]) => notities(k).length ? `<h3>${l}</h3>${telling(notities(k)) ? `<p class="vraag">Telling: ${telling(notities(k))}</p>` : ''}<table class="obs"><tr><th style="width:9%">Min.</th><th style="width:14%">Soort</th><th>Coach zegt of doet</th><th style="width:34%">Spelers doen daarna</th></tr>${notities(k).map((x) => `<tr><td>${esc(minTekst(x))}</td><td>${esc(x.soort || '')}</td><td>${esc(coachTekst(x))}</td><td>${esc(x.spelers || '')}</td></tr>`).join('')}</table>` : '').join('')}` : ''}
      <h2>Evaluatiegesprek</h2>
      ${STAPPEN.map((s, i) => `<div class="p-blok"><h3>${i + 1}. ${s.t}</h3><p class="vraag">${s.v}</p>${tekstOfLijnen(e[s.k], 2)}</div>`).join('')}
      <div class="kader"><h3 style="margin-top:0">Eén concreet ontwikkelpunt</h3><p>${esc(e.punt)}</p></div>
      ${e.schaal ? `<p style="margin-top:6pt"><b>Leerdoel teruggezien (HO):</b> ${esc(e.schaal)}</p>` : ''}
      ${String(e.begeleiding || '').trim() ? `<h3>Wat had de coach meer of anders van de HO nodig?</h3><p>${esc(e.begeleiding)}</p>` : ''}
      <h2>Reflectie trainer</h2>
      ${REFLECTIE.map(([k, v]) => `<div class="p-blok"><h3>${v}</h3>${tekstOfLijnen(e[k], 3)}</div>`).join('')}
      <p class="voetregel">Gemaakt met ClubComm · ${esc(new Date().toLocaleDateString('nl-NL'))}</p>`;
    document.title = `Evaluatie ${e.coach || 'coach'} ${e.datum || ''}`.trim(); };
  // Observatieformulier op papier: leeg, met leerdoel en signalen als die in het voorgesprek staan
  const regelsVan = (s) => String(s || '').split(/\n+/).map((x) => x.replace(/^[\s•*\-\d.)]+/, '').trim()).filter(Boolean);
  const maakPapier = () => { const e = huidig(); const signalen = regelsVan(e.signalen);
    const kol = '<tr><th style="width:8%">Min.</th><th style="width:13%">Soort</th><th>Coach zegt of doet</th><th style="width:34%">Spelers doen daarna</th></tr>';
    const rijen = (n) => Array.from({ length: n }, () => '<tr><td></td><td class="soort">V D C Co</td><td></td><td></td></tr>').join('');
    const turf = `<table class="turf"><tr>${SOORTEN.map((w) => `<th>${w}</th>`).join('')}</tr><tr>${SOORTEN.map(() => '<td></td>').join('')}</tr></table>`;
    const gegeven = (l, v) => `<tr><td>${l}</td><td>${v ? esc(v) : '<div class="regels"></div>'}</td></tr>`;
    document.getElementById('afdruk').innerHTML = `
      <h1>Observatieformulier coach</h1><p class="sub">Praktijkbegeleiding${e.bijeenkomst ? ` · bijeenkomst ${esc(e.bijeenkomst)}` : ''}</p>
      <table class="gegevens">${gegeven('Coach', e.coach)}${gegeven('Team', e.team)}${gegeven('Datum', e.datum && (e.leerdoel || e.tegenstander) ? datumLang(e.datum) : '')}${gegeven('Tegenstander', e.tegenstander)}</table>
      <h3>Persoonlijk leerdoel coach</h3>${tekstOfLijnen(e.leerdoel, 2)}
      <p class="vraag" style="margin-top:6pt">Noteer per moment de minuut, omcirkel de soort (<b>V</b>raag, <b>D</b>irectief, <b>C</b>orrectie, <b>Co</b>mpliment), schrijf zo letterlijk mogelijk wat de coach zegt of doet en wat de spelers daarna doen. Geen oordeel: dat komt in het gesprek.</p>
      <h2>1e helft · laatste 20 min</h2><table class="obs leeg">${kol}${rijen(10)}</table>
      <h3>Telling 1e helft</h3>${turf}
      <h2 class="nieuwe-pagina">Rust · kleedkamer</h2><table class="obs leeg kort">${kol}${rijen(4)}</table>
      <h2>2e helft · eerste 20 min</h2><table class="obs leeg">${kol}${rijen(9)}</table>
      <h3>Telling 2e helft</h3>${turf}
      <h2>Gewenst spelersgedrag</h2><p class="vraag">Turf hoe vaak je het wel en niet zag.</p>
      <table class="turf"><tr><th style="width:52%">Signaal</th><th>1e helft wel</th><th>niet</th><th>2e helft wel</th><th>niet</th></tr>${(signalen.length ? signalen : ['', '', '']).map((x) => `<tr><td>${esc(x)}</td><td></td><td></td><td></td><td></td></tr>`).join('')}</table>
      <p class="voetregel">Gemaakt met ClubComm · mijnclubcomm.nl/evaluatie</p>`;
    document.title = `Observatieformulier ${e.coach || 'coach'}`.trim(); };
  let afdrukSoort = 'evaluatie';
  window.addEventListener('beforeprint', () => { if (afdrukSoort === 'papier') maakPapier(); else maakAfdruk(); });
  window.addEventListener('afterprint', () => { afdrukSoort = 'evaluatie'; document.title = 'Evaluatie coach · ClubComm'; });

  render();
})();
</script>
</body>
</html>
