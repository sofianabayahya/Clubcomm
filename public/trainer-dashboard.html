<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trainer Dashboard - ClubComm</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Compacte trainer dashboard styling */
    .trainer-header {
      background: linear-gradient(135deg, #1e5ba8, #164a91);
      border-radius: 20px;
      color: white;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      text-align: center;
      box-shadow: 0 8px 32px rgba(30, 91, 168, 0.3);
    }

    .trainer-header h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.4rem;
    }

    .trainer-meta {
      display: flex;
      justify-content: center;
      gap: 2rem;
      font-size: 0.9rem;
      opacity: 0.9;
    }

    /* Huidige training info */
    .current-training {
      background: linear-gradient(135deg, #10b981, #059669);
      border-radius: 15px;
      color: white;
      padding: 1rem;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .current-training h3 {
      margin: 0 0 0.5rem 0;
      font-size: 1.1rem;
    }

    .training-time {
      font-size: 1.2rem;
      font-weight: 600;
    }

    /* Compacte speler grid - mobile first */
    .players-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 0.75rem;
      margin-bottom: 2rem;
    }

    /* Mobile-first grid */
    @media (max-width: 768px) {
      .players-grid {
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }
    }

    .player-card {
      background: white;
      border-radius: 12px;
      padding: 0.75rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      border: 2px solid transparent;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
      min-height: 140px;
    }

    /* Compact mobile card */
    @media (max-width: 768px) {
      .player-card {
        padding: 0.5rem;
        min-height: 120px;
      }
    }

    .player-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(0,0,0,0.15);
      border-color: #1e5ba8;
    }

    .player-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #ff6b00, #1e5ba8);
      opacity: 0;
      transition: opacity 0.3s ease;
    }

    .player-card:hover::before {
      opacity: 1;
    }

    .player-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      padding-bottom: 0.5rem;
      border-bottom: 1px solid #f1f3f5;
    }

    .player-name {
      font-weight: 600;
      color: #1e293b;
      font-size: 1rem;
    }

    .attendance-status {
      padding: 0.25rem 0.5rem;
      border-radius: 20px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    .status-present {
      background: #dcfce7;
      color: #166534;
    }

    .status-absent {
      background: #fef2f2;
      color: #991b1b;
    }

    .status-late {
      background: #fef3c7;
      color: #92400e;
    }

    .status-unknown {
      background: #f1f5f9;
      color: #475569;
    }

    /* Compacte actie knoppen - alleen essentie */
    .player-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .action-btn {
      background: white;
      border: 1px solid #e1e5e9;
      color: #64748b;
      padding: 0.6rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
      min-height: 40px;
    }

    .action-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }

    .btn-late {
      border-color: #f59e0b;
      color: #f59e0b;
    }

    .btn-late:hover,
    .btn-late.active {
      background: #f59e0b;
      color: white;
    }

    .btn-noshow {
      border-color: #ef4444;
      color: #ef4444;
    }

    .btn-noshow:hover,
    .btn-noshow.active {
      background: #ef4444;
      color: white;
    }

    /* Player info en quick stats */
    .player-quick-stats {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #64748b;
      margin-bottom: 0.75rem;
    }

    .quick-stat {
      text-align: center;
    }

    .quick-stat-number {
      font-weight: 600;
      color: #1e293b;
      display: block;
    }

    .quick-stat-label {
      font-size: 0.7rem;
    }

    /* Expanded acties menu */
    .expanded-actions {
      display: none;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.5rem;
      margin-top: 0.5rem;
      padding-top: 0.5rem;
      border-top: 1px solid #f1f3f5;
    }

    .expanded-actions.show {
      display: grid;
    }

    .secondary-btn {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #475569;
      padding: 0.4rem;
      border-radius: 6px;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.25rem;
    }

    .secondary-btn:hover {
      background: #e2e8f0;
      color: #334155;
    }

    .expand-toggle {
      background: none;
      border: none;
      color: #64748b;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 0.25rem;
      border-radius: 4px;
      transition: all 0.3s ease;
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
    }

    .expand-toggle:hover {
      background: #f1f5f9;
      color: #1e293b;
    }

    /* Quick summary */
    .training-summary {
      background: white;
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .summary-stats {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 1rem;
      text-align: center;
    }

    .summary-stat {
      padding: 0.75rem;
      border-radius: 8px;
      background: #f8fafc;
    }

    .summary-number {
      font-size: 1.5rem;
      font-weight: 700;
      color: #1e5ba8;
      display: block;
    }

    .summary-label {
      font-size: 0.8rem;
      color: #64748b;
      margin-top: 0.25rem;
    }

    /* Mobiele optimalisaties */
    @media (max-width: 768px) {
      .players-grid {
        grid-template-columns: 1fr;
        gap: 0.75rem;
      }

      .trainer-meta {
        flex-direction: column;
        gap: 0.5rem;
      }

      .summary-stats {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.75rem;
      }

      .player-actions {
        grid-template-columns: repeat(2, 1fr);
        gap: 0.4rem;
      }

      .action-btn {
        font-size: 0.7rem;
        padding: 0.4rem;
      }

      .expanded-actions {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 480px) {
      .players-grid {
        grid-template-columns: 1fr;
      }

      .summary-stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .player-card {
        padding: 0.75rem;
      }

      .action-btn {
        min-height: 32px;
        font-size: 0.65rem;
      }
    }

    /* Modal styling voor player details */
    .player-modal {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 10000;
      backdrop-filter: blur(8px);
      padding: 1rem;
    }

    .player-modal-content {
      background: white;
      border-radius: 20px;
      padding: 2rem;
      max-width: 600px;
      width: 100%;
      max-height: 85vh;
      overflow-y: auto;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      position: relative;
    }

    .modal-tabs {
      display: flex;
      border-bottom: 2px solid #f1f3f5;
      margin-bottom: 1.5rem;
    }

    .modal-tab {
      padding: 0.75rem 1rem;
      border: none;
      background: none;
      color: #64748b;
      font-weight: 500;
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: all 0.3s ease;
    }

    .modal-tab.active {
      color: #1e5ba8;
      border-bottom-color: #1e5ba8;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

    <div class="quick-actions-toolbar" style="background: white; border-radius: 12px; padding: 1rem; margin-bottom: 1rem; box-shadow: 0 4px 15px rgba(0,0,0,0.08);">
      <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 0.5rem; margin-bottom: 1rem;">

    <!-- Training samenvatting - compacter -->

  <script src="script.js"></script>
  <script>
    let currentTeam = 'O10-1';
    let currentTrainer = {
      name: 'Marco van der Berg',
      team: 'O10-1',
      role: 'Hoofdtrainer'
    };

    // Sample player data
    const teamPlayers = {
      'O10-1': [
        'Jesse de Jong',
        'Mees van Dijk', 
        'Rayan Bakker',
        'Tom Jansen',
        'Lisa van der Berg',
        'Sem Vermeulen',
        'Daan Peters',
        'Nova Hendriks',
        'Luca Smit',
        'Amy de Wit',
        'Finn van Loon',
        'Zoë Visser'
      ]
    };

    // Player statistics tracking
    const playerStatistics = {};
    let playerAttendance = {};

    // Portal switching functionality
    function switchPortal(portalType) {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');

      if (!currentUser.portalAccess || !currentUser.portalAccess.includes(portalType)) {
        alert('Je hebt geen toegang tot dit portal');
        return;
      }

      localStorage.setItem('currentPortal', portalType);

      switch(portalType) {
        case 'parent':
          window.location.href = 'ouderportaal.html';
          break;
        case 'teamleider':
          window.location.href = 'teamleider-dashboard.html';
          break;
        case 'trainer':
          window.location.reload();
          break;
        default:
          console.log('Unknown portal type:', portalType);
      }
    }

    function initializePortalSwitcher() {
      const currentUser = JSON.parse(localStorage.getItem('currentUser') || '{}');
      const portalSwitcher = document.getElementById('portalSwitcher');

      if (currentUser.dualPortalUser && currentUser.portalAccess && currentUser.portalAccess.length > 1) {
        portalSwitcher.style.display = 'block';

        if (currentUser.portalAccess.includes('teamleider')) {
          document.getElementById('teamleiderPortalBtn').style.display = 'inline-block';
        }

        document.getElementById('trainerPortalBtn').style.background = 'linear-gradient(135deg, #1e5ba8, #164a91)';
        document.getElementById('trainerPortalBtn').style.color = 'white';
      }
    }

    document.addEventListener('DOMContentLoaded', function() {
      initializePortalSwitcher();
      loadTrainerInfo();
      detectCurrentTraining();
      loadPlayersGrid();
      updateSummaryStats();
    });

    function detectCurrentTraining() {
      const now = new Date();
      const dayOfWeek = now.getDay();
      const currentHour = now.getHours();
      const currentMinute = now.getMinutes();

      // Training schema voor team O10-1
      const trainingSchedule = [
        { day: 3, time: '18:30', name: 'Woensdag Training', duration: 90 }, // Wednesday
        { day: 5, time: '18:30', name: 'Vrijdag Training', duration: 90 },  // Friday
        { day: 6, time: '14:00', name: 'Zaterdag Wedstrijd', duration: 120 }  // Saturday
      ];

      let currentTraining = null;
      let trainingStatus = 'upcoming';

      // Check vandaag
      const todayTraining = trainingSchedule.find(t => t.day === dayOfWeek);
      
      if (todayTraining) {
        const [trainingHour, trainingMin] = todayTraining.time.split(':').map(Number);
        const trainingStartTime = trainingHour * 60 + trainingMin;
        const currentTime = currentHour * 60 + currentMinute;
        const trainingEndTime = trainingStartTime + todayTraining.duration;

        if (currentTime >= trainingStartTime - 60 && currentTime <= trainingEndTime) {
          // Training is binnen 1 uur of al bezig
          currentTraining = todayTraining;
          if (currentTime >= trainingStartTime) {
            trainingStatus = 'active';
          } else {
            trainingStatus = 'starting_soon';
          }
        }
      }

      // Als geen training vandaag, zoek eerstvolgende
      if (!currentTraining) {
        for (let i = 1; i <= 7; i++) {
          const checkDay = (dayOfWeek + i) % 7;
          const nextTraining = trainingSchedule.find(t => t.day === checkDay);
          if (nextTraining) {
            currentTraining = nextTraining;
            trainingStatus = 'upcoming';
            break;
          }
        }
      }

      // Fallback
      if (!currentTraining) {
        currentTraining = trainingSchedule[0];
      }

      // Bereken correcte datum
      const trainingDate = calculateTrainingDate(currentTraining, trainingStatus);
      
      // Update display met status indicator
      const statusEmoji = {
        'active': '🟢 BEZIG',
        'starting_soon': '🟡 START BINNENKORT',
        'upcoming': '📅'
      };

      const statusText = statusEmoji[trainingStatus] || '📅';
      
      document.getElementById('currentTrainingTitle').innerHTML = `
        ${statusText} ${currentTraining.name}
      `;

      const dateStr = trainingDate.toLocaleDateString('nl-NL', { 
        weekday: 'long', 
        day: 'numeric', 
        month: 'long' 
      });

      document.getElementById('currentTrainingTime').textContent = `${dateStr} - ${currentTraining.time}`;

      // Store current training info globally voor attendance
      window.currentTrainingInfo = {
        ...currentTraining,
        date: trainingDate,
        status: trainingStatus,
        isToday: trainingStatus === 'active' || trainingStatus === 'starting_soon'
      };

      return currentTraining;
    }

    function calculateTrainingDate(training, status) {
      const now = new Date();
      const dayDiff = training.day - now.getDay();
      
      let trainingDate = new Date(now);
      
      if (status === 'active' || status === 'starting_soon') {
        // Training is vandaag
        return trainingDate;
      } else if (dayDiff > 0) {
        // Training is later deze week
        trainingDate.setDate(now.getDate() + dayDiff);
      } else {
        // Training is volgende week
        trainingDate.setDate(now.getDate() + (7 + dayDiff));
      }
      
      return trainingDate;
    }

    function getPlayerStats(playerName) {
      if (!playerStatistics[playerName]) {
        // Bereken totaal aantal activiteiten in seizoen van HJO planning
        const seasonActivities = calculateSeasonActivities();
        const late = Math.floor(Math.random() * 3);
        const noShows = Math.floor(Math.random() * 2);
        const totalMissed = late + noShows;
        
        playerStatistics[playerName] = {
          totalActivities: seasonActivities,
          late: late,
          noShows: noShows,
          yellowCards: noShows, // Gele kaart voor elke no-show
          attended: seasonActivities - totalMissed
        };
      }

      const stats = playerStatistics[playerName];
      const attendanceRate = Math.round((stats.attended / stats.totalActivities) * 100);

      return {
        ...stats,
        attendanceRate
      };
    }

    function calculateSeasonActivities() {
      // Bereken automatisch aantal trainingen + wedstrijden per seizoen
      // 2 trainingen per week × 30 weken + 20 wedstrijden = 80 activiteiten
      const weeksInSeason = 30;
      const trainingsPerWeek = 2;
      const matchesInSeason = 20;
      
      return (weeksInSeason * trainingsPerWeek) + matchesInSeason;
    }

    function getPlayerAttendance(playerName) {
      const attendance = playerAttendance[playerName] || 'present';

      const statusMap = {
        present: { class: 'status-present', label: 'Verwacht' },
        late: { class: 'status-late', label: 'Te laat' },
        noshow: { class: 'status-absent', label: 'Niet afgemeld' }
      };

      return {
        status: attendance,
        ...statusMap[attendance]
      };
    }

    function setAttendance(playerName, status) {
      // Als speler op 'present' wordt gezet (door terug te klikken), reset naar default
      if (playerAttendance[playerName] === status) {
        delete playerAttendance[playerName]; // Reset naar default 'present'
        status = 'present';
      } else {
        playerAttendance[playerName] = status;
      }

      // Update visual state
      const card = document.querySelector(`[data-player="${playerName}"]`);
      const buttons = card.querySelectorAll('.action-btn');

      buttons.forEach(btn => btn.classList.remove('active'));
      if (status !== 'present') {
        card.querySelector(`.btn-${status}`).classList.add('active');
      }

      // Update attendance status display
      const attendanceStatus = card.querySelector('.attendance-status');
      const newStatus = getPlayerAttendance(playerName);
      attendanceStatus.className = `attendance-status ${newStatus.class}`;
      attendanceStatus.textContent = newStatus.label;

      // Handle special cases
      if (status === 'noshow') {
        handleNoShow(playerName);
      } else if (status === 'late') {
        handleLateArrival(playerName);
      }

      updateSummaryStats();

      // Save to localStorage
      localStorage.setItem('playerAttendance', JSON.stringify(playerAttendance));

      const statusText = status === 'present' ? 'verwacht' : newStatus.label.toLowerCase();
      showNotification(`${playerName} gemarkeerd als ${statusText}`, 'info');
    }

    function handleNoShow(playerName) {

    function updateSummaryStats() {
      const players = teamPlayers[currentTeam] || [];
      const totalPlayers = players.length;

      let lateCount = 0;
      let noShowCount = 0;
      let expectedPlayers = totalPlayers;

      players.forEach(player => {
        const attendance = playerAttendance[player] || 'present';
        if (attendance === 'late') lateCount++;
        else if (attendance === 'noshow') {
          noShowCount++;
          expectedPlayers--; // Niet afgemelde spelers worden niet meer verwacht
        }
      });

      document.getElementById('totalPlayers').textContent = totalPlayers;
      document.getElementById('expectedPlayers').textContent = expectedPlayers;
      document.getElementById('lateCount').textContent = lateCount;
      document.getElementById('noShowCount').textContent = noShowCount;
    }

    function generateProgressOverview(playerName, evaluations) {
      const phases = ['voorbereiding', 'heenronde', 'winter', 'terugronde'];

      return `
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem;">
          ${phases.map(phase => {
            const phaseData = evaluations[phase];
            const hasData = phaseData && Object.keys(phaseData).length > 0;
            const avgScore = hasData ? calculateAverageScore(phaseData, criteria) : 0;
            
            return `
              <div style="background: white; padding: 1rem; border-radius: 8px; text-align: center; border: 2px solid ${hasData ? '#22c55e' : '#e5e7eb'};">
                <div style="font-weight: 600; color: #1e293b; margin-bottom: 0.5rem;">${getPhaseLabel(phase)}</div>
                <div style="font-size: 1.5rem; font-weight: bold; color: ${hasData ? '#1e5ba8' : '#9ca3af'};">
                  ${hasData ? avgScore.toFixed(1) : '-'}
                </div>
                <div style="font-size: 0.8rem; color: #64748b;">Gemiddeld</div>
                ${hasData ? '<div style="margin-top: 0.5rem;"><i class="fas fa-check-circle" style="color: #22c55e;"></i></div>' : '<div style="margin-top: 0.5rem;"><i class="fas fa-clock" style="color: #9ca3af;"></i></div>'}
              </div>
            `;
          }).join('')}
        </div>
      `;
    }

    function getPhaseLabel(phase) {
      const labels = {
        'voorbereiding': 'Voorbereiding',
        'heenronde': 'Heenronde', 
        'winter': 'Winterstop',
        'terugronde': 'Terugronde'
      };
      return labels[phase] || phase;
    }

    function calculateAverageScore(phaseData, criteria) {
      let total = 0;
      let count = 0;
      
      criteria.forEach(criterion => {
        if (phaseData[criterion]?.score) {
          total += parseInt(phaseData[criterion].score);
          count++;
        }
      });
      
      return count > 0 ? total / count : 0;
    }

      // Save to localStorage
      const allEvaluations = JSON.parse(localStorage.getItem('playerEvaluations') || '{}');
      allEvaluations[playerName] = evaluations;
      localStorage.setItem('playerEvaluations', JSON.stringify(allEvaluations));

    }

    function generateMessageHistory(messages) {
      if (messages.length === 0) {
        return '<p style="color: #64748b; text-align: center; padding: 2rem;">Nog geen berichten verstuurd</p>';
      }
      
      return messages.map(msg => `
        <div style="border-bottom: 1px solid #e5e7eb; padding: 1rem 0;">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
            <span style="font-weight: 600; color: #1e293b;">${msg.subject || 'Trainer bericht'}</span>
            <span style="color: #64748b; font-size: 0.9rem;">${new Date(msg.timestamp).toLocaleString()}</span>
          </div>
          <p style="margin: 0; color: #374151;">${msg.content}</p>
        </div>
      `).join('');
    }

    function insertTemplate(type) {
      const templates = {
        positive: `Hallo! Ik wil graag even delen dat ${getCurrentPlayer()} het erg goed doet tijdens de trainingen. Hij/zij toont goede inzet en maakt mooie vorderingen. Blijf zo doorgaan!`,
        improvement: `Hallo! Ik wil graag een paar verbeterpunten bespreken voor ${getCurrentPlayer()}. Tijdens de trainingen zie ik mogelijkheden voor groei op het gebied van... Graag thuis ook aandacht besteden aan...`,
        attendance: `Hallo! Ik wil graag de aanwezigheid van ${getCurrentPlayer()} bespreken. Regelmatige deelname aan trainingen is belangrijk voor de ontwikkeling. Kunnen we dit samen bespreken?`
      };
      
      const composer = document.getElementById('messageComposer');
      composer.value = templates[type] || '';
    }

    function sendPlayerMessage(playerName) {
      const content = document.getElementById('messageComposer').value.trim();
      if (!content) {
        alert('Voer een bericht in');
        return;
      }
      
      const message = {
        id: Date.now(),
        playerName: playerName,
        content: content,
        timestamp: new Date().toISOString(),
        sender: currentTrainer.name,
        team: currentTeam,
        read: false
      };
      
      // Save to player messages
      const playerMessages = getPlayerMessages(playerName);
      playerMessages.unshift(message);
      
      const allMessages = JSON.parse(localStorage.getItem('playerMessages') || '{}');
      allMessages[playerName] = playerMessages;
      localStorage.setItem('playerMessages', JSON.stringify(allMessages));
      
      // Also save to parent notifications
      const parentNotifications = JSON.parse(localStorage.getItem('parentNotifications') || '[]');
      parentNotifications.unshift({
        id: Date.now(),
        type: 'trainer_message',
        title: `📧 Bericht van trainer`,
        message: content,
        playerName: playerName,
        team: currentTeam,
        sender: currentTrainer.name,
        timestamp: new Date().toISOString(),
        read: false
      });
      localStorage.setItem('parentNotifications', JSON.stringify(parentNotifications));
      
      // Clear composer and update history
      document.getElementById('messageComposer').value = '';
      document.getElementById('messageHistory').innerHTML = generateMessageHistory(playerMessages);
      
      NotificationManager.show(`Bericht verstuurd naar ouders van ${playerName}`, 'success');
    }

    function getPlayerNote(playerName) {
      const notes = JSON.parse(localStorage.getItem('playerNotes') || '{}');
      return notes[playerName] || '';
    }

    function savePlayerNote(playerName, note) {
      const notes = JSON.parse(localStorage.getItem('playerNotes') || '{}');
      notes[playerName] = note;
      localStorage.setItem('playerNotes', JSON.stringify(notes));
    }

    function loadTrainerInfo() {
      const storedTrainer = JSON.parse(localStorage.getItem('currentTrainer') || 'null');
      if (storedTrainer) {
        currentTrainer = storedTrainer;
        currentTeam = storedTrainer.team;
      }

      document.getElementById('trainerName').textContent = currentTrainer.name;
      document.getElementById('assignedTeam').textContent = currentTrainer.team;
    }

    function showNotification(message, type = 'info') {
      if (typeof NotificationManager !== 'undefined') {
        NotificationManager.show(message, type);
      } else {
        console.log(message);
      }
    }

    // Close modal when clicking outside
    document.getElementById('playerModal').addEventListener('click', function(e) {
      if (e.target === this) {
        closePlayerModal();
      }
    });

    // Load saved attendance on page load
    const savedAttendance = localStorage.getItem('playerAttendance');
    if (savedAttendance) {
      playerAttendance = JSON.parse(savedAttendance);
    }
  </script>
</body>
</html>
